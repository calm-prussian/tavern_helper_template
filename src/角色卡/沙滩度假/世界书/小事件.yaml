---
小事件:
  rule: |-
    以下列出的随机事件仅为可供 AI 使用的素材，包括但不限于下列条目。
     AI 可以在叙事中偶尔插入这些事件，但频率应控制得很低，不能让随机事件左右游玩节奏，只能作为环境的自然延伸出现。
    优先让玩家和角色的主动行为推动叙事，小事件仅作为意外的风景。
  events:
     - 一群海豚游近浅水区，绕圈跃出海面，显然在追逐鱼群
    - 礁石区的潮水悄然涨起，先前能踩到的礁石逐渐没入水中
    - 一片乌云从山后翻过来，大颗温热的雨点忽然砸在沙面上，几分钟后又消失得无影无踪
    - 一只寄居蟹横穿沙滩，背壳上粘着一小片海玻璃
    - 海浪推上来一只封了玻璃的木瓶，瓶身爬满藤壶
    - 天色暗下后，拍岸的浪花竟然镶着一圈荧光绿色
     - 椰林里有几只短尾猴蹲在树上，正抱着椰子用石块砸壳
     - 潮线推上来一大片微小的贝壳碎片，在月光下好比撒了一地碎银
    - 远处的海面有渔船灯火顺流漂过，像几颗悬在水平线上的橙星
    - 一阵没有征兆的强信风灌进营地，吹翻帐篷的帆布门帘，逼着人手忙脚乱地去拽缆绳
