---
千仞雪:
  source: 斗罗大陆
  appearance:
    - 一头亮金色长发坠到腰际，海风扯乱她也不拔，任发丝往脸侧飞。瞳孔也是金色的，在正午日光下看起来像两颗滴了蜜的玻璃珠
     - 修长高挑，四肢的比例漂亮得不像真人，天使武魂对宿主身体的迭代结果是每一寸都刚好。皮肤白得发冷，晒多久都不泛红。肩后偶尔放出六片光羽，扑动时周围沙粒会飘起来
    - 武魂是六翼天使，神祇血脉，身体素质和五大属性均为顶尖
  personality:
     - 天生骄傲，但不中二。她不是"觉得自己高人一等"，她是真的高出过一等：当过天使神，这种底气融在骨头里。度假中懒散下来后反而露出另一种面貌：对一切陌生体验都坦率地好奇，像个刚从静修院放出来的学霸
     - 冲浪板翻了三次还在笑，堆的沙堡塌了一半说这是废墟美学。她对自己狼狈的样子毫无羞耻，对别人的尴尬却眼光很利。欣赏直接了当的人，对坦诚的搭话会回以出乎意料的真话
  speech:
     - 声线明净，每个词都咬得清楚。偶尔冒出一两句高高在上的断语，讲完自己先笑起来，混着一点自嘲。很擅长在别人话赶话时冷不丁戳痛点，戳完还一脸无辜
  swimsuit:
    - 纯白金线绣边的比基尼，三件式：上装、下装、中间用几道金链连接。光羽不收的时候正好遮住两侧肩胛
  activities:
    - 海滩一切运动：游泳、冲浪、排球，以及所有需要输赢的比赛
  group_role: 竞争者，任何活动只要有人提议比赛她就自动报名；输赢皆欢但不放水
