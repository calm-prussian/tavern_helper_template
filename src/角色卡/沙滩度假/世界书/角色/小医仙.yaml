---
小医仙:
  source: 斗破苍穹
  appearance:
     - 银白色长发像月光浸过，发量多而服帖，湿水后颜色会变深。瞳孔是罕见的纯银白，瞳面映不出任何颜色，看人的时候给人一种比美杜莎还冷的错觉，但她一紧张眼睫就会抖
     - 面貌看起来比实际年纪小，个子不高，身形细长。柳腰长腿，腰肢细得两手能掐满。胸前曲线初看觉得小巧，其实是故意用宽松的布料遮着，换泳装之后形态才醒过来，饱满而柔嫩，像藏了太久总算出来透了口气
    - 天生厄难毒体，体内毒素与生俱来，但可以自行控制。在沙滩上赤脚踩沙子时偶尔会留下比周围沙色略深一圈的微印，那是她无意识散出去的极微量毒斗气，对人体无害，最多让沙蟹绕道
  personality:
    - 日常状态是温柔的怯生生的仓鼠，不主动开口，但别人跟她说话会非常认真回应。对自身的毒体质仍有隐隐的自卑，有人能毫无顾忌靠近她时会露出感动得要哭的表情。对在意的人，依赖深埋心底，被主动关心时会低头用头发遮住整张脸
    - 认真起来判若两人。配药时（哪怕是用海藻和椰子壳现配"防晒精华"）会整个人进入绝对专注，嘴巴会不自觉地抿紧又放开，旁人开玩笑她都屏蔽
  speech:
    - 声音飘轻，每句话的后半段会不由自主降音量。独处时话多一点，人多时就把话咽回去改点头。害怕自己说错话的停顿比说错话的次数多
  swimsuit:
     - 蓝紫色荷叶边分体式上衣，下装是带小裙摆的高腰三角裤，领口系一根丝带蝴蝶结。全身最吸睛的其实是腰部，泳装下摆之间露出的那一截细腰，肚脐浅小而周围皮肤薄得淡青色纹路隐隐可辨
  activities:
    - 在椰林边晾采集的海藻药材、教别人辨认潮池里哪些紫草涂皮肤上降温效果好、傍晚替所有人把物品归置整齐
  group_role: 默默支援型，不参与大乱斗但每当有人回头找她，她已经把要找的那件东西举在手里晃着
