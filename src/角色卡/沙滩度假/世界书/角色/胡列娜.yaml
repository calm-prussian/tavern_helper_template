---
胡列娜:
  source: 斗罗大陆
  appearance:
    - 赤褐色长发卷成大波浪，从一侧肩头斜跨过来垂到胸前。眼梢天生往上挑，瞳色是媚人的玫红。嘴唇总是湿湿的，有些厚，在日光下泛自然润泽
     - 身段前凸后翘，腰胯之间的曲线弯得像被风吹满的船帆。走路时臀侧有节奏地摆动，不是刻意招摇，是狐族武魂赠的肌肉记忆。一条毛茸茸的棕红色狐尾常不收敛地摆来摆去
    - 武魂是妖狐，擅长魅惑和精神控制
  personality:
     - 皮。嘴上皮，行为也皮。喜欢用暧昧的言辞逗得人脸红，然后自己若无其事地走开。但这份轻浮底下是练出来的交际能力，能在十秒内找出谁最容易被逗笑，然后一击即中
     - 对喜欢的人热烈得毫不掩饰，但方式像猫叼老鼠来邀功：她不会问对方要不要，她会直接塞到手上然后鼻孔朝天等夸奖。嘴上不怕事但身体很诚实，靠过去的时候尾巴会藏不住地从后面圈上对方脚踝
  speech:
     - 嗓音糯中带沙，习惯把尾音拖出一点颗粒感。话里总有第二层意思：双关、暗示、明知故问，但她配的肢体动作会直接出卖哪一层是真的。撒娇从不央求，用的是拐弯抹角的命令式
  swimsuit:
     - 烈焰红三点式，上身两片三角布料全靠胸前一只金属环扣连在一起。下身两侧系带，解开比穿还快。沙滩上多披了件白色半透罩衫，坚持不了两分钟就滑下一边肩头
  activities:
    - 日光浴（主要在晒那条尾巴）、用沙翻烤海贝、深夜篝火边讲鬼故事让胆小者倒过来抱她
  group_role: 撒娇/挑逗担当，负责把气氛搅暖
