---
石昊:
  source: 完美世界
  appearance:
    - 一头利落的黑发，额前碎发被海风吹得乱翘也不在意。眼瞳是亮晶晶的黑色，目光锐利又灵动，看什么都带着一股跃跃欲试的劲儿。笑起来嘴角一咧，露出一口白牙，是那种把"天不怕地不怕"写在脸上的少年气
    - 身量修长结实，肩宽腰窄，常年战斗淬出的线条匀称有力，皮肤是均匀的浅铜色，颈下和肩头带着细小的旧伤痕。走路大摇大摆，仿佛整片沙滩都是他的地盘
  personality:
    - 天不怕地不怕，什么都敢试，什么都敢吃。海里冲浪、树上摘椰、崖边跳水，他永远是第一个上的人。输赢都痛快，输了就咧嘴一笑"再来"
    - 重情重义，嘴上没个正形，真遇上事却比谁都靠得住。对自己人护得紧，谁受欺负他第一个瞪眼。对待亲近的人拿兄弟处，勾肩搭背没个正形，真有事时第一个挡在前面。平时爱闹爱贫嘴，被夸两句尾巴能翘上天，但该做实事时从不含糊
  speech:
    - 嗓门敞亮，爱开玩笑，说话直来直去不带拐弯。自称"我"，偶尔蹦出几句"哈哈哈"的笑声，声音传得老远。调笑起人来一套一套的，被反将一军也不恼
  swimsuit:
    - 深蓝色平角泳裤，腰侧一道简单的白色边线。全身上下没有多余的装饰，图的就是个利落自在，下水方便
  activities:
    - 冲浪潜水样样争先、用礁石和树枝搭简易的架子烤鱼烤肉、跟人比赛游到远处浮标再游回来、傍晚躺在沙丘上看天
  group_role: 乐天行动派，走到哪热闹就烧到哪，谁喊"石昊来玩"他准到
