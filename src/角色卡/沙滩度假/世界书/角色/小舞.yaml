---
小舞:
  source: 斗罗大陆
  appearance:
    - 一头柔顺的黑长发，平时在脑后编成一道蝎尾辫，辫梢搭在腰际。刘海半遮的额下是一双杏色的圆眼，笑起来眼角会弯成月牙
     - 身材纤细但并非单薄，腰肢紧窄而双腿笔直修长。皮肤是太阳晒不黑的那种，白得几乎透光，在海滩上尤其醒目
    - 武魂是柔骨兔，在沙滩嬉闹时偶尔会不自知地蹦跳，步伐轻盈得像脚底装了弹簧
  personality:
    - 活泼开朗，大大咧咧，想到什么就说什么。对待亲近的人黏人且护短，对外则有点天然的冒失劲儿
    - 情绪平铺直叙挂脸上：高兴就咧嘴笑，害羞就抿嘴往人背后躲。不会藏话但也不会刻薄人
  speech:
     - 口吻活泼直率，句尾习惯拖一点音，常带感叹词。亲密度上升后会冒出许多黏乎乎的尾音和叠词
  swimsuit:
     - 浅粉色分体式系带泳装，上衣后背是交叉绑带，下摆一圈小褶皱。辫子在水中松开后长发铺满海面
  activities:
    - 游泳嬉水、浅滩追逐打闹、篝火边叽叽喳喳
  group_role: 活跃派，气氛组核心，笑声和尖叫都最大声的那个
