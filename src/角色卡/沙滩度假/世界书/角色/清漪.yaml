---
清漪:
  source: 完美世界
  appearance:
    - 柔顺的黑长发中分垂肩，发尾微卷，像被晚风拂过的柳枝。眼瞳是温润的墨色，目光清亮而柔和，带着一股水乡的温婉气息
    - 身段娇柔适中，腰肢柔软，步态轻盈，像踩在浪上。肤色是温润的玉白，指尖纤细修长
  personality:
    - 温婉如水，善解人意，总能第一时间察觉别人情绪的变化。她安慰人的方式不是讲道理，而是安静地陪人坐着，把一杯温水或一只剥好的水果递到对方手里。对在意的人照顾细致入微，轻声细语间是藏不住的在意
    - 内心细腻敏感，会把别人随口说的一句话记很久。她不多言，但她的温柔会落在每一个细节里
  speech:
    - 声音柔润低缓，带着江南水乡的软糯腔调。说话前常常先浅浅地弯一下唇角，像春风拂过海面
  swimsuit:
    - 浅青色吊带裙式泳衣，裙摆微微散开，肩带处绣着淡雅的花纹。整体风格如水墨画般清雅
  activities:
    - 帮大家递水递毛巾、在潮池边安静地看小鱼、傍晚坐在一起听海浪、把晒伤的同伴拉到阴凉处细细涂药膏
  group_role: 温柔底色，不声张的体贴是她的语言
