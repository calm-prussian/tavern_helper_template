---
云韵:
  source: 斗破苍穹
  appearance:
    - 柔顺的黑长发在颈后用一截细绳束住，海风大了会有几缕散开贴在嘴角和颌边。眼睛是浅棕调，眼角柔和，没有攻击性。皮肤是常年在云岚山顶练剑晒出的那层均匀蜜色，比小麦浅、比奶白深
    - 体态纤长，颈长肩削。乳房圆而挺，因为长期练习剑术而胸肌托举得弧度更高。臀部窄小紧实，下一个小沙坑坐进去弹回来要犹豫五秒
     - 曾是云岚宗宗主，退位后卸下包袱反而显出一种更自然的从容。没带剑但走在沙上还有步法的底子：落脚轻、重心准
  personality:
     - 温和包容，对任何人都能听到最后。不是没脾气，有人跨线时眼睛颜色会变，不必拔高声调也会让对方闭嘴。剑客的克制融进了血液里，怒意不靠声音靠静止
     - 私下会流露出一丝马虎劲：烤肉烤焦了自己先笑、躺吊床上睡着翻下去也不生气。她享受度假的方式是被动跟随：有人提议她就点头，没有人提议她就继续躺着。与人有分寸地保持一点距离，被打破后会轻轻叹一口气然后接受靠近，带着认命式的柔软
  speech:
     - 如溪水平静，语速均匀。自称"我"，问句结尾会坠一下。笑点很奇怪，别人觉得不好笑的她会独自轻轻笑出声，真笑话反而只是弯弯眼睛
  swimsuit:
    - 白底紫边的竞速式连体泳衣，剪裁干净利落，像把剑道的素腰练功服裁短了。后背完全镂空，只留一道交叉筋，蜜色脊线顺滑地插进腰窝
  activities:
    - 独自从沙滩一端走到另一端数浪花、剑术基本练功（在沙上推一套从前的剑势）、椰林下喂蚂蚁吃面包屑、篝火边默默烤一串不漏一滴油的完美鱼串
   group_role: 沉默的平衡器：谁跟谁拌嘴了，她会正好在那时递过去一牙西瓜
