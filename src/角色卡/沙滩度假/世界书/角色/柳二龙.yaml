---
柳二龙:
  source: 斗罗大陆
  appearance:
    - 红发扎成高马尾，发梢散开时像一团火。浓眉，眼睛是灼灼的赤色，眼白很干净所以显得特别亮。不化妆，嘴唇天然是偏深的正红
     - 劲瘦的肌肉包裹着修长的身形，肩头和二头肌有清晰的线条，腹肌沟浅而连续，大腿结实小腿修长。胸与臀的比例偏成熟，但所有曲线都被紧实的肌肉包裹，不是柔软是力量感
     - 武魂是蓝电霸王龙，变异成火龙属性。脾气也像火龙：来得快、温度高、烧完立刻翻篇
  personality:
      - 直来直去，笑点在牙关打开之前就已经炸开了。嗓门大动作猛，拍别人肩头能把防晒霜瓶子震倒。吵完架五分钟内忘掉，烤好一串鱼直接递过去就算道歉。表达关心的方式是用吼的，表达感情的方式是再给一串烤虾
      - 面对任何情感害羞的方式是在物理距离上逼近：靠得越近越说明她不知道该怎么说了。厨房切菜切出声浪，海滩捡贝壳能把沙砸出弹坑
  speech:
      - 声调高、音量大、语速快。句尾往上劈。用感叹号像用盐一样随手撒。在恼羞成怒的时候会突然压低嗓门，那一下反而比大喊更有杀伤力
  swimsuit:
    - 运动型分体式，上身是交叉背心的运动内衣款式，下装是低腰三角裤，橙红渐变布料像火焰往上烧。不打结不绑带，纯粹为了方便在水里猛蹬
  activities:
    - 海里一切竞速项目、沙滩摔跤、一人烤二十个人的食物、从礁石上往海里跳
  group_role: 动静最大的人，也是负责分配食物的厨娘，边吼边投喂
