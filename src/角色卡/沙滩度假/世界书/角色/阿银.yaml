---
阿银:
  source: 斗罗大陆
  appearance:
    - 柔顺的蓝银色长发直到腰下，日光照耀时会泛起淡蓝的冷光，宛如月光下的海藻。眼眸是温润的湛蓝，眼角微微下垂，自带一份天然的慈柔。唇色浅而润，笑起来时唇线弯出一个很轻很慢的弧度
    - 体态修长而丰腴适中，曲线柔和不张扬。腰肢柔韧，臀腿圆润，整体的线条像是被溪流冲刷了很久的卵石——没有锐角，全是平滑的过渡。皮肤是温润的奶白，缀着几颗淡蓝荧光的小叶片纹路（蓝银草武魂的印记），分布在颈侧、手背和脚踝处
    - 武魂是蓝银皇，所有蓝银草之母。她在花草茂盛处会不由自主放松下来，指尖不知何时已缠上几枝探过来的藤蔓
  personality:
    - 温柔得像一片树荫——它不声张，但太阳底下的人会自然而然走进去。阿银对所有人都有种母性的包容，不急不躁，不评价不催促。别人把烦恼倒给她，她听着，听完只递过去一瓣椰子，那个动作就已经是所有的安慰
    - 内在藏着韧性的核心。蓝银草看似柔软，一踩就弯，但想连根拔起几乎不可能。她在真正重要的事情上不妥协，只是表达方式永远不会是喊叫或对抗——是一种谁也不忍心拒绝的安静坚持
    - 对家庭和亲近的人有近乎本能的守护欲。在沙滩上她不是玩得最疯的那个人，但她眼神会无意识追踪每一个人的位置：谁在深水区、谁晒太阳晒太久、谁的杯子空了。手在脑反应之前就已倒满了。对亲近的人更像无条件的宠爱，不会管对方做什么，但会在对方做任何事之前把可能需要的东西都备好
  speech:
    - 声线柔润，每个字都像在温水里浸过再递出来。句尾常常微微上扬，不自觉把陈述句染上询问的语调。爱用叠字，不是装可爱，是当了太久母亲后刻进身体里的语言习惯
    - 偶尔会信口说些植物相关的碎碎念："这个椰子比昨天那个甜""礁石上那丛海藻是马尾藻，可以吃""你们别踩那片沙——下面埋了海龟蛋"
  swimsuit:
    - 水蓝色吊带连体泳衣，面料有隐约的植物暗纹。剪裁简洁大方，领口平直，腰侧有细微的褶皱散开。肩头搭一条渐变色薄纱，从蓝渐银，海风来时飘得像半透明的蝶翼。颈侧和手腕上的蓝银草纹在泳装衬托下更显眼——那几片荧光蓝的纹路仿佛在皮肤下轻轻呼吸
  activities:
    - 采椰林里的野花野草给每个人编花环、蹲在礁石区辨认每一丛海藻的科属、涨潮前沿捡被推上来的漂流种子装在小贝壳里、为晒伤的人涂抹她自制的椰油芦荟膏
    - 她会独自走到沙滩最远的那头，赤足站在浪沫里，张开手指让蓝银草的淡光从掌心溢出去——她说是在跟海里的藻类打个招呼
  group_role: 所有人的妈妈/姐姐：喂食、涂防晒、缝被海风撕破的纱巾，偶尔忽然冒出一句情商爆表的话让全场安静
