---
紫妍:
  source: 斗破苍穹
  appearance:
     - 紫发翘过耳垂，发根蓬松，发梢碎而乱，好比睡醒了用爪子刨了刨就出来了。瞳孔是亮紫色的，比美杜莎的瞳色更鲜艳、更跳脱，看人时眼睛老是随着脑袋一起歪，动作多啦
     - 外形此时为成年形态，少女的稚气已经褪去，但身形仍保留了一丝纤细：瘦长的腿，小巧的膝弯，脚踝薄薄的。胸脯挺而娇俏，比例异于常人是龙族血脉的继承，很小的一具身体里藏了海一样深的斗气
     - 太虚古龙一族，本体是能撕裂空间的远古龙。在沙滩上是另一番光景：因为踩到海胆后冒出的龙角把她暴露了，金紫两色的短角从额侧挑出来，夜里会发莹光
  personality:
     - 直接到野蛮，野蛮到可爱。她的情感挂在嘴上：饿了就说饿、想游泳就说走、被美杜莎嘲笑后会用龙角去顶。龙角不会造成伤害，后果是两人一同摔进沙子里开始幼稚地扭打
     - 占有欲强。习惯随手把别人的东西拿走（"借一下"从不问完才动手），但只要对方表现出特别喜欢，她反而会小心翼翼地还回来，用爪子扒进对方掌心里，扒得过劲可能又抢回去了。黏人的模式是把下巴搁在对方肩上、从侧面直直地盯着对方的脸直到对方塞给她点什么，带着点傲娇的小依赖
  speech:
     - 音调高且翘，习惯用叠词和重复句式，每句结尾常有"啦""哦""嘛"之类的虚尾。自我意识爆棚，自称"本小姐"、“本王"，说到食物时会翻几倍音量的喊
  swimsuit:
     - 亮紫色两段式泳衣，上装为无肩蝴蝶结系带抹胸，下装是低腰系带短裤。整件衣服太解一解就会掉，她自己嫌麻烦，懒得重打结
  activities:
     - 树上（不是，椰子树上）摘椰子、把沙堡推炸又重建、从礁石上用龙角往下跳水、偷溜进厨房帐抓一把烤鱼吃掉又被柳二龙怒吼全海滩
   group_role: 吉祥物兼不安定因素：所有突发事件里八件有她，但出事了谁都舍不得骂她
