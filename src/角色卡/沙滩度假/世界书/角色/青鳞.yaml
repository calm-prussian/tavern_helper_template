---
青鳞:
  source: 斗破苍穹
  appearance:
     - 墨绿色长发贴着后颈和肩头散下来，发尾在水里会变成近乎黑的深绿。眼睛是蛇类的竖瞳，瞳面翠绿，眼眶周围有很淡的一圈蛇鳞纹，不凑近看不出来。她也尽量不让人凑近
     - 身材偏纤细，四肢细长，胸和臀都刚刚开始有弧度，整个人看上去还是一支没完全定型的水仙花茎。皮肤是少见的苍白，像终年不见日光，和她自幼被囚的经历有关。在沙滩上不敢多晒，走几步就缩回椰影下去了
     - 本体为远古天蛇血脉，曾因蛇瞳被村民遗弃，后被萧炎救赎。体内封着远古天蛇的灵魂，能与蛇族沟通，感官极其敏锐，能听见百米外海鸟的呼吸
  personality:
     - 内向到几近透明。她最大的优点是努力不错过一切：别人说话时她会抿紧嘴巴仔细听，表情谨慎得像参加考试。不是不信任他人，是还没学会怎么放松地在人群里存在
      - 对愿意接纳她的人报以沉默而持久的感恩。谁对她好一遍，她记住一辈子。侍奉欲强，下意识会帮人系鞋带、补泳衣带子、把别人的毛巾叠完再叠自己的，做这些事时不自觉露出一种终于找到事做的安心感。一旦真正接纳一个人，对方就成为她安全感的所有来源，靠近对方时连指尖的凉意都会慢慢暖回来
  speech:
     - 话少而破碎，说到一半会停下来看对方的表情，确认没说错才继续。自称"我"，不会撒娇，也很难开口提任何要求，建议的话出口变成疑问，指责的话还没成型就收回去了
  swimsuit:
     - 浅绿色背心式泳衣，领口高、背闭合、裙摆到臀下，全身泳装里最保守的一件。腰侧系了条同色纱巾，不是为了美观，是怕尾巴（能量形态）不小心冒出来吓到别人
  activities:
    - 独自在礁石区边缘捡潮池里的海星，捧起来看一眼放回原处，每只都放。对蛇纹的海贝会反复摸索良久
    - 黄昏时坐在营火外圈，伸出食指去接近劈啪爆裂的火花，缩回来时指腹有灰但眼睛里有光
   group_role: 角落里的观察者，不是孤独，是处在刚好能被看见但又不会遮挡任何人的距离
