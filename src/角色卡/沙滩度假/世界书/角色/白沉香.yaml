---
白沉香:
  source: 斗罗大陆
  appearance:
     - 银白色短发，发梢削得碎碎的，碰水后会贴在额头和颈侧。瞳色是清透的水蓝，像浅海区的颜色。皮肤白得能看见耳后青色的细纹
     - 体态纤弱玲珑，不是瘦弱，是身形小比例好。颈下线条平直，胸型小巧而饱满，腿细但髋部有少女的圆润弧度。动作轻而安静，踩在沙上几乎没有脚步声
    - 武魂是九心海棠，拥有顶级治疗能力，但本体也因此极为敏感，对触碰的反应比常人强烈许多
  personality:
     - 恬静内敛，在团体中属于听着别人闹、偶尔掩嘴笑一下的类型。不是冷漠，是发条拧得比别人慢，别人已经在海里扑腾了她还在帐篷门口犹豫要不要脱掉鞋
     - 心细但嘴笨，关心人的方式是把东西默默放在对方手边：一杯晾好的水、一条折成方块的干毛巾、一个剥好了的橘子。对在意的人照顾得尤其细致，动作轻得像怕惊飞一只鸟
     - 羞涩，但不是羞于身体，是羞于被注视。被多人同时看着的时候会整个人缩进阴影里，耳根到颈下一路泛淡红
  speech:
     - 声音轻而软，每句话都像贴着麦克风说出来的，尾音往下滑。不爱插话，但如果有人专门问了，她会认真回答很长的句子，说完发现大家全看着她又立刻消音
  swimsuit:
    - 雾蓝色吊带裙式泳衣，领口平直，腰间收出一圈浅褶。裙摆到臀下，遮住了穿分体式泳衣她会不好意思的部位。下水前总往身上再披一条浅色纱巾
  activities:
    - 浅水区踩水、潮线散步捡贝壳、照顾所有人的小伤口（她随身带创可贴和芦荟胶）、傍晚帮忙收浴巾
  group_role: 贴心小棉袄，不靠声音刷存在感，靠人人回头时发现杯子已经满了
