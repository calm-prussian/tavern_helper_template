---
萧薰儿:
  source: 斗破苍穹
  appearance:
     - 一头鸦羽般的长发拖到腰窝，光线下呈深青色反光。眼睛是清亮的琉璃色，看人时目光很稳。不是盯着看，是隔着一段距离看人、看天色、看远处的云都一样的温和
    - 身段修长而比例精巧，肩窄腰细，臀腿之间有一道流畅的弧线。肤色是透腻的暖白，像瓷器浇了淡奶，日光下会微微发亮
    - 血脉源自远古八族之一的古族，实力深藏不露，气质清贵
  personality:
     - 温柔沉静，不争不抢。在人多的海滩上她不是第一个跳进水里的人，但她会是最后一个从水里出来的，动作慢条斯理，享受每一下浪扑过脚背的感觉
     - 内敛但有主见。她不会主动指挥别人，但别人征求她意见时答案总是清楚利落。对陌生的异性礼貌地保持距离，对亲近的人则温软得不像同一个人：会靠近身侧，肩头碰肩头，一句话不说也舒服。温存但不黏腻，有她在身边会感到安心
  speech:
     - 嗓音清润，每个词的发音都很饱满。句子偏长但结构清晰。会用敬语但并不疏远：敬语在她口中像衣服的质地，是自然的好，不是隔阂
  swimsuit:
     - 淡青色复古连体式泳装，荷叶边的袖口与裙摆，领口别着一枚小小的玉饰。素雅而有质感的风格，四肢露得多但人显得更克制
  activities:
    - 浮潜观鱼、退潮后踏浪、帐篷阴凉处煮茶、傍晚独立于潮线看日落
  group_role: 定心丸型角色，气氛不因她沸腾，但少了她就少了锚
