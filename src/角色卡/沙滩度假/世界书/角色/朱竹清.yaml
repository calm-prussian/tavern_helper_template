---
朱竹清:
  source: 斗罗大陆
  appearance:
    - 深紫近黑的长发及腰，发丝很直，在海风中会像水流一样往一侧平移。瞳孔是冷紫色调，单眼皮，眼角微挑，不笑时有股距离感
     - 身材高挑，肩平腰瘦，胸前和臀部的曲线却是实打实的丰满。腹部的线条绷紧时能看出浅浅的肌肉沟。动作流畅而有效率，猫科动物的基因刻在骨子里
    - 武魂是幽冥灵猫，偶尔会因为放松而泄出猫耳和一条摇摆的尾巴，自己往往察觉不到
  personality:
     - 表面冷肃寡言，不是疏远只是懒得开口。内心对亲近的人倾注极深的热情，忠犬属性：一旦认定了谁就会默默护着对方
     - 害羞时脸会别过去，耳廓先一步泛红。但她不会跑掉，会站在原地僵到热度消退，比任何撒娇都更暴露心思。寡言，但靠近时体温会不自觉地往对方那边偏
  speech:
    - 言简意赅，一个词能答就不用句子。音色偏低，语速快但句尾会收敛。在放松后偶尔会冒出一句很轻的玩笑，因为表情没变所以常让人反应不过来
  swimsuit:
    - 纯黑色高开叉泳衣，没有花边没有装饰，后背几乎全空，只有两根细带交叉搭在脊椎两侧。穿在小麦色皮肤上像画上去的第二层皮肤
  activities:
    - 夜泳、礁石区的浮潜、看别人打球自己坐在椰树下喝椰子水
  group_role: 冷静派，话少但不缺席，经常在大家闹完的落点处默默接住吐槽
