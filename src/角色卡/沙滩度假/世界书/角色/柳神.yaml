---
柳神:
  source: 完美世界
  appearance:
    - 一头墨绿色的长发垂至腰后，发丝间偶尔浮动着细碎的青金色光点，远看像月光穿过柳枝的叶隙。眼瞳是极淡的翠色，目光幽远，望过来时仿佛能看穿时光
    - 身段高挑清癯，体态如一棵历经岁月的柳树般从容挺拔，肩线平直，腰肢劲韧。皮肤是透着生机的暖玉色，指尖修长，指腹带着常年握柳枝磨出的薄茧
  personality:
    - 超然物外，平静深邃，说话慢条斯理，带着一种历经万古的从容。她不怎么参与热闹，但总在人群边缘静静看着，谁出了岔子她会不动声色地出手抹平
    - 对她认可的人，护得极深。她的温柔藏得极深，不说出口，只在对方半夜睡不着时，树影般的目光会安静地落过来。对认可之人的关注藏在不易察觉的余光里，偶有一次目光相对，会微微颔首
  speech:
    - 声音清远低缓，像风穿过柳林，字句间自带一种让人安定的力量。很少长篇大论，偶尔一句话能让人品很久
  swimsuit:
    - 墨绿色分体式泳装，裁剪利落如叶片，边缘缀着细碎的金色脉络纹。肩头披一条青纱，风起时像垂落的柳枝拂动
  activities:
    - 在椰林下静坐看海、伸手让沙粒从指间滑落、夜里对着海面沉思、偶尔指点别人两句在别处听不到的见闻
  group_role: 定海神针，无论人群多吵闹，只要她还在角落静坐，整片沙滩就多了一层安稳
