  swimsuit:
     - 深蓝与金线交织的单肩连体泳衣，右侧从颈下斜裁到左腰，左侧覆盖肩头再连到后背，线条修长而端庄。腰际一条金链软腰带，阳光下忽明忽暗
  activities:
