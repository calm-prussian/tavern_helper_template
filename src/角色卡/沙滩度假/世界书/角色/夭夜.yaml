---
夭夜:
  source: 斗破苍穹
  appearance:
     - 金色长发在阳光下呈现出成熟麦浪的颜色，编成松散的侧辫从右肩垂到胸前。眼睛是琥珀色的，安静而有份量，当一个公主看一个人，她看的不只是对方，还有对方背后的天色和身后的海岸线
     - 体态端庄而骨感：身量在女性中偏中上，身形清晰但不宽，肩峰、手腕、踝关节都削得刚好。不是少女式的单薄而是常年处理政务坐下来练出的长韧，腰背永远不塌
     - 伽玛帝国的大公主和军事统帅，见过死人，见过战场，见过宫廷里最复杂的微笑。到沙滩后把所有人都看了一遍，然后第一个动手搬帐篷桩子，从骨子里觉得务实比指挥有用
  personality:
     - 理性、可靠、不动声色地照顾所有人。在团体中自然承担调度者角色，谁去捡柴、谁去烧水，分配得无人察觉，因为她说话方式像在跟人商量，从来不下指令
     - 压抑深厚的情感在肩后。她不会率先靠近任何人，但有人靠近她的时候身体不会躲，肩头会微微前倾一点，像在用手臂和肋侧的夹角为对方挡风。对信赖的人，会用仅两人能听清的音量说出需要帮忙的地方
  speech:
