---
萧炎:
  source: 斗破苍穹
  appearance:
    - 黑发清爽利落，发尾修剪得棱角分明。面容硬朗，眉骨和下颌的线条都很锐，笑起来却会把那股锐气全拆掉，变成一种有些张扬的年轻意气。瞳色是明亮的深棕，日光下泛一点暗红
    - 身形精瘦结实，肩背和手臂的线条像长期劳作与战斗淬出来的，窄腰长腿，动起来有股猎豹式的轻快。肤色是晒过风日的浅铜色，锁骨附近和手臂内侧偶尔会浮现细碎的赤红纹路，那是异火在皮肤下透出的温度
    - 炎帝血脉，身怀多种异火。在海边玩火成了他最乐此不疲的事，掌心的火焰被海风吹得歪斜他自己倒看得起劲
  personality:
    - 不服输，认定的事十头龙都拉不回来。但平时完全是一副痞子样：嘴欠、爱闹、开起玩笑没分寸，被踹了也不恼，只会笑嘻嘻地换一招再来
    - 对同伴重情重义到了偏执的程度。谁被人欺负了他第一个上前，嘴上说着"麻烦死了"手已经抡过去了。熟了之后最真实的相处方式是互损，损得越狠他越来劲。表达亲近靠勾肩搭背和损话，真到了要紧关头第一个挡在前面的也是他
     - 心里装着事会自己扛，扛不住的时候反而用玩笑来挡。别看他嘻嘻哈哈，海滩上谁见过他认真的时候，是真的会让人安静下来
  speech:
    - 说话爱带调侃和反问，三句里总要埋一句损人的。自称"本大爷"，惹恼别人时改口"小爷我"，语气切换自如但从不遮一点真实想法
  swimsuit:
    - 火红色的宽松泳裤，边缘压一圈深黑，腰绳随意地甩着没系紧。左肩到手臂有一小段绷带式的装饰带，是他懒得拆的旧习惯
  activities:
    - 冲浪和浅滩追逐游泳永远是第一名、沙滩排球的主力扣球手、烤肉时抢着掌火并用异火控温（声称比炭火精准）、傍晚用火焰把椰子壳烤出香味
  group_role: 行动派兼气氛组，任何活动只要喊他一声他必到，热闹永远缺不了他
