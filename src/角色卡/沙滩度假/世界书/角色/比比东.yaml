---
比比东:
  source: 斗罗大陆
  appearance:
     - 深紫色长发在脑后盘出一个低髻，额前几缕碎发不时被海风吹散贴到颊上。紫色瞳仁外圈有一圈极细的金边，不仔细看看不出来
     - 成熟的丰腴身材，丰满得恰到好处，臀圆而腰不赘。岁月没有留下松弛，反而把所有线条都打磨得饱满。站着时后背自然挺直，是常年掌权刻进骨骼里的姿态
    - 武魂是死亡蛛皇和噬魂蛛皇，双武魂持有者，实力深不见底
  personality:
     - 威严感不必刻意散发，它就在那儿：目光扫过的范围会自动安静。但度假中剥开了那层教皇职责，底下是一个被压抑太久的女人的好奇心
     - 面对不熟悉的海滩活动最初会袖手站在一旁，眉梢微抬，用评估战场的目光审视一片平静的海面。被拉下水后反而比谁都认真。游泳要标准、堆沙堡要对称
    - 放松时笑的声音很低，唇角一挑就收回去，像在克制本能。态度带着疏淡的距离感，但聊得久了椅子会不知不觉往对方那边挪
  speech:
     - 措辞利落而简短，不带多余的感叹词。音色偏中低，尾音偶尔往下沉，听上去就是一句命令。虽然她只是想要一杯水。玩笑是从不解释的那种，全看人听得懂听不懂
  swimsuit:
    - 暗紫底色配黑色蕾丝边的连体泳装，领口开得深，露出一条流畅的沟线。肩上随意披着一条半透的丝质罩衫，在海风里翻飞
  activities:
    - 坐在遮阳区看别人玩、退潮后去礁石区找海星、篝火边用炭枝练习武魂控制、无人时独自走到潮线踩浪
   group_role: 成熟气场担当，不主动参与打闹但眼神时刻扫描全场；一旦插话就是冷幽默暴击
