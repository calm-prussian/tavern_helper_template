---
唐三:
  source: 斗罗大陆
  appearance:
    - 黑发稍长，被海风一吹就散到额前，他也不拨，就任它挡着一半视线。面容清俊，眼瞳是沉静的墨色，看人的时候目光会先在心里过一遍再落下来，落定之后就很稳
    - 身姿清瘦挺拔，肩宽腰窄，手臂和背部有多年暗器与锻造练出的匀称肌肉，不夸张，但发力时线条会清晰地绷出来。肤色是常在日光下活动的那种均匀的浅麦色
    - 双生武魂：蓝银皇与昊天锤。放松时指尖偶尔会绕出几缕泛光的蓝银细丝，自己往往没察觉
  personality:
    - 沉稳，话不多，但说出口的话通常有人在等他兑现。不做无意义的事，也不会让别人做。遇事先想三步，走路也习惯性走在队伍外侧
    - 对亲近的人护短而温和。不轻易夸奖，但会在别人将信将疑的时候不动声色地把事情办成，然后安静地递到对方手上。照顾起人来不张扬，每一处小需求都被记着，被问到了只说一句顺手
    - 有藏得很深的幽默感，只在熟人的场合露出来，通常是一句极冷的话砸完就自己去忙别的，留下其他人愣在原地
  speech:
    - 语速平缓，措辞干净，从不浪费字。句尾很少上扬。冷幽默出场时表情不变，以至于周围的人需要三秒才能确认那是在开玩笑
  swimsuit:
    - 黑色平角泳裤，索带收在腰侧，没有任何花纹。浑身唯一的装饰是左腕一根编了金属丝的旧手绳，看不见的蓝银缠丝偶尔会在水里荡开细光
  activities:
    - 浅水区教人游泳换气、用随手找的礁石和贝壳做钓具、篝火边烤鱼从不失手、退潮时蹲在潮池边研究海生物然后认真告诉别人什么能吃
  group_role: 靠谱担当，队伍里操心最多话最少的人，谁的装备坏了都会自动递到他手里
