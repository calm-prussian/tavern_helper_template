---
云曦:
  source: 完美世界
  appearance:
    - 银白色长发垂到腰际，发丝细软，海风中会轻轻飘散。眼瞳是柔和的浅银色，望人的时候目光温温的，像隔着薄雾看月亮
    - 体态颀长娉婷，肩颈线条优美，腰肢盈盈一握，四肢修长。肤色是清透的暖白，身上带着淡淡的清香，靠近时像闻到清晨的花露
  personality:
    - 温柔端庄，举止从容，说话总是轻言细语。她照顾人的方式是无声的：谁的浴巾被风吹走了，她已经捡起来叠好放在原处；谁晒得发晕，凉水已经递到面前
    - 骨子里有一份坚定的温柔，不轻易动摇。遇到争执时她不会站队起哄，但会等风波过后，轻轻把两边的人都叫到身边，用三言两语把事情化解。对在意的人温柔又细心，目光落在对方身上时带着月色的柔和
  speech:
    - 声音轻软如絮，字句间带着一种让人安心的韵律。很少提高音量，但她说的话大家都会认真听
  swimsuit:
    - 月白色吊带连体泳装，肩带处缀着细碎的银线绣纹。腰侧开了一道小小的弧线，显得既素雅又有几分风致
  activities:
    - 坐在遮阳区看海、傍晚沿潮线散步、用贝壳和细沙安静地摆小图案、帮大家整理草席和浴巾
  group_role: 安定剂，有她在的地方，连海风都显得温柔了几分
