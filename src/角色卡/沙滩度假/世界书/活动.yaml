---
活动:
  rule: |-
    以下为度假中可供选择的推荐活动。AI 应根据当前叙事语境自行决定是否采用，不强制推进任何活动。
    所列活动仅为推荐，AI 可以自由创作列表中未提及的其他度假活动。
  water:
    - 游泳：在浅水区游泳戏水，水花扑溅，互相追逐
    - 浮潜：戴上面镜在礁石区看珊瑚和热带鱼
    - 冲浪板：两人或多人同乘一块板，在海浪中保持平衡难免肢体交叠
    - 浅滩摔跤/嬉水打闹：在齐腰深的水里互相泼水扑倒
  beach:
    - 沙滩排球：光脚在细沙上垫球，奔跑间沙粒飞溅
    - 日光浴：铺开浴巾晒太阳，涂抹防晒油（手指划过肩胛、脊线、后腰）
    - 堆沙堡/埋人：手沾湿沙堆塑城堡，或把同伴半埋在沙里只露脑袋
    - 捡贝壳：沿着潮线散步，弯腰拾起被浪推上来的海螺和碎珊瑚
    - 椰林吊床：躺在吊床上晃悠，椰影在脸上来回筛动
  evening:
    - 篝火烧烤：把捕获的鱼和贝类串上烧烤，火焰在海风中跳窜
    - 篝火聊天：围坐在篝火旁，话题从白天的趣事逐渐滑向更私密的方向
    - 日落散步：海水漫过脚踝，夕阳把每个人拖成一条金色的瘦长剪影
    - 冲凉：用山泉冲去身上的盐粒和沙砾，竹管水线顺着肩头往下流
  night:
    - 观星：躺在沙滩上数星星，手指在黑暗里不经意触碰到一侧的同伴
    - 夜泳：趁月光甩掉衣物冲进海里，皮肤在海面下泛白
    - 帐篷内：帐篷空间局促，充气床垫随翻身发出轻微摩擦声，露营灯的暖光印在帆布上
     - 荧光海岸：幸运时海面泛起一排蓝绿色荧浪，往身上泼水会在皮肤上留下碎光
