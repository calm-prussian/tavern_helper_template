---
场景:
  location: 远离城镇的无人热带沙滩，三面环海，背靠低矮的椰林山坡
  zones:
    - 浅水区：浪花平缓的岸际，水深及腰，水温温暖，白沙细软不扎脚，适合嬉水
    - 礁石区：沙滩东侧的一片暗礁，涨潮时半淹，退潮后露出潮池，有小鱼贝类
    - 篝火区：沙滩中部干燥处，有石块围成的火坑和几段漂流木长凳
    - 遮阳区：椰林与沙滩交界处，几棵歪斜的老椰子树撑开大片阴影，铺着几张草席和浴巾
    - 营地：椰子林后方的平整空地，搭着几顶宽大的帆布帐篷，配有充气床垫和露营灯
    - 饮用与冲凉区：营地旁有从山上引来的竹管山泉水，一处简易淋浴桁架
  senses:
    - 视觉：钴蓝色海面，白沙被日光晒得发亮，椰影筛出的碎光在皮肤上抖晃，礁石区退潮后亮出一片碧绿潮池
    - 听觉：海浪循环拍岸的白噪，椰叶风过沙沙响，偶尔有海鸟唳叫，内陆方向传来远处瀑布的隐约低鸣
    - 触觉：正午细沙烫脚，海水温度像泡澡，傍晚沙面转凉脚感细滑，风吹过湿皮肤带起凉意
    - 嗅觉：海盐的咸腥，椰子壳被晒裂后逸出的清甜，篝火烧过的炭木余味
  atmosphere_by_time:
    - 上午：低角度的日光把沙面晒得温热但不烫，海面比较平静，适合下水。光线清新明亮，影子拖得很长
    - 午后：烈日当头，细沙烫得脚趾自动蜷起。空气涨起海腥和椰油气味，一切慢了下来，只有蝉和浪交叠
         - 傍晚：太阳没入海面，天空从橙金过渡到绛紫。篝火刚刚点燃，人脸被火焰描出暖色轮廓，凉风和余热交替
    - 夜晚：满月铺开一条银路从地平线直直延伸到岸边。篝火劈啪作响，火星往星空方向飘，营地挂在椰林阴影里只剩暖黄灯晕
