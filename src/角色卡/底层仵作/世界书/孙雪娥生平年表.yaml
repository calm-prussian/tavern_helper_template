孙雪娥基本信息
来历：西门庆前妻陈氏的陪嫁丫鬟→收房为第四房
在府中地位：妻妾中最低——有"四娘"名分却不受宠，甚至不如丫鬟庞春梅得势
特长：擅长厨艺，负责西门府膳食
结局：西门庆死后与仆人来旺私通盗窃→被抓→被发卖→被春梅买回当丫头→被卖入妓院→自缢
生平年表
年份	事件
政和前	作为陈氏陪嫁丫鬟进入西门家。陈氏死后被西门庆收房，为第四房妾。在府中专管厨房事务
1113（政和三年）	被潘金莲激怒→与金莲争吵→春梅挑拨→西门庆打了雪娥一顿。从此雪娥在府中地位一落千丈，彻底沦为边缘人
1114—1117	地位最低的妾室，连丫鬟都不如。偶尔才会被西门庆想起（"他一年难得去她房间一次"）
1118（重和元年）正月	西门庆死前几天感到腰腿疼痛，在雪娥房中过夜——这是她最后一次被"临幸"
1118年后	与仆人来旺私通，偷盗钗环首饰逃走。被抓回后，吴月娘将她发卖
约1124年	被已成为周守备夫人的春梅买回府中，故意折辱——让昔日"四娘"给自己当丫鬟
最后	被卖入妓院，无法忍受，自缢而死
