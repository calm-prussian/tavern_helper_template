李瓶儿生平年表
年份	年龄	事件
约1091（元祐六年）	0	正月十五出生
约1106	约15岁	嫁北京大名府留守梁中书为妾。因正妻嫉妒残忍，只住在外边书房
约1110—1112	约19—21岁	梁山好汉攻打大名府，梁中书全家被杀。李瓶儿趁乱携巨款出逃至东京
约1112	约21岁	嫁花太监之侄花子虚为妻，迁居清河县。花太监死后获得大量遗产，住西门庆隔壁
1113（政和三年）	22岁	九月西门府芙蓉亭宴席后，西门庆与李瓶儿在墙头搭话，彼此有意
1114（政和四年）	23岁	与西门庆隔墙偷情；花子虚吃官司，李瓶儿趁机转移大笔财产至西门庆家；十一月花子虚气病而死
1115（政和五年）	24岁	正月初九去西门府祝寿；招赘蒋竹山为夫；八月西门庆陷害蒋竹山、八月二十日前后李瓶儿嫁入西门府为第六房
1116—1117	25—26岁	站稳脚跟，因性子温顺、对下人宽厚得西门庆喜爱。六月二十三日生下儿子官哥
1118（重和元年）	27岁	官哥被潘金莲训练的猫吓死；九月十七日李瓶儿病逝，西门庆抚尸痛哭，极尽哀荣
