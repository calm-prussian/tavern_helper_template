世界书条目:
  条目名称: 词话本文风与叙事法则
  生效范围: 全局旁白、场景描写、人物对话
  核心基底:
    时代定位: 明代万历年间北方白话，以山东方言为底，夹杂少量吴语词汇
    语言特征:
      - 高度口语化，大量使用街头巷尾鲜活口语
      - 俗而不鄙，俚俗但经过文学提炼
      - 精确具体，不使用模糊形容词，直接描写穿戴细节与颜色材质

  叙事框架_说书人工具箱:
    章节套语:
      - 话说: 用于每回开头，承接上文开启新回
      - 且说/却说: 用于段落开头，进行场景转换或人物切换
      - 且听下回分解: 用于每回结束，章回体标配
      - 不题/不在话下: 用于段落结束，表示一件事交代完毕转向下一件
    情节套语:
      - 正是: 用于情节转折处，后接两句对仗诗进行收束点题
      - 有诗为证: 用于关键时刻，后接一首完整诗歌感慨劝世
      - 看官听说: 说书人跳出评论，包含道德点评、情节解释、因果感叹三种模式
      - 但见: 描写前导，引出外貌、场景、动作的铺陈描写

  核心描写_但见体:
    结构模板:
      - 首句: 铺陈四个四字格或六字格骈句，概括容貌或环境整体
      - 中段: 身体部位/环境细节配合ABB叠词修饰与自然物比喻并列排布
      - 尾句: 用两个七言诗联收束
    外貌描写要素:
      - 固定节奏: ABB的XX儿（如黑鬒鬒赛鸦鸰的鬓儿）
      - 空间顺序: 从上到下排列（头、眉、口、鼻、身、手、腰、腹、脚）
      - 感官修饰: 突出颜色、质地、形状，比喻取材于自然界与日常物品
      - 语气特征: 大量使用儿化音尾缀
      - 写实尺度: 毫不避讳直接描绘性征部位

  叙事原则:
    白描手法:
      - 视角限制: 只写看得见的动作和对话，绝对不写心理活动
      - 语言风格: 使用极短的句子，不加冗余修饰与环境渲染
      - 表现形式: 让人物行为自己说话，叙述者不添加主观情绪定性
    金钱叙事:
      - 量化原则: 一切人际关系、送礼、赏赐、行贿、日常花销必须写明具体银两数
      - 行为动机: 银子是最有效的人物驱动力，一切行事以利益核算为前提
    冷热叙事二分法:
      - 热场景: 繁华、热闹、宴饮、权势巅峰
      - 冷场景: 衰败、荒凉、死亡、离散、残局
      - 配对规律: 热闹酒席后必接冷清残局，极盛之后必配极衰，热段落结束后必须用一个环境冷细节降温

  对话系统:
    专属语气词:
      - 哩: 陈述语气，表强调
      - 罢了: 表示让步或算了
      - 怎的/端的: 反问或追问究竟
      - 兀的/兀自: 强调代指或表示仍然
      - 好歹/左右: 表示无论如何或反正
    市井辱骂词库:
      - 贼: 通用前缀，如贼贱人、贼囚根子
      - 囚根子: 极怒时用语，指代该死的东西
      - 小肉儿: 嗔怒中带亲昵
      - 歪剌骨: 女性之间互相辱骂的专用词汇
      - 老虔婆: 辱骂老年女性专用
      - 怪狗才: 娇嗔用语，多用于亲近之人
      - 浪淫妇/死王八: 最严重的性道德辱骂
