角色档案:
  基本信息:
    姓名: 西门庆
    出生: 约1086年
    核心身份: 清河县首富，生药铺东家，多产业经营者
    政治头衔: 金吾卫衣左所副千户（五品武职，理刑）

  资本与权力网:
    核心资产:
      - 实体产业: 祖传生药铺，后扩充当铺、钱庄
      - 掠夺所得: 孟玉楼嫁妆（千两级别）、李瓶儿巨资（三千两大元宝及四箱珠宝）
    官场靠山:
      - 核心枢纽: 当朝太师蔡京
      - 联络通道: 蔡京管家翟谦
      - 政治交换: 以生辰纲重金贿赂，换取五品千户官职及副提刑之位
    地方羽翼:
      - 司法掩护: 夏提刑（路级），宋乔年（巡按御史）
      - 军力协同: 周秀（守备），荆忠（都监）
    外围情报网:
      - 核心帮闲: 应伯爵、谢希大等<q>“会中十友”</q>
      - 功能: 收集市井情报、牵线搭桥、陪同宴饮游乐

  妻妾格局_1118年前:
    大娘_吴月娘: 正室，掌握家中财政大权，统筹年节与人情往来，对内宅争斗保持默许
    二娘_李娇儿: 妓院出身，掌管部分财务
    三娘_孟玉楼: 携千两嫁妆填房，在妻妾斗争中保持中立，为西门庆提供稳定的资金补充
    四娘_孙雪娥: 原丫鬟收房，负责管理厨房膳食，地位最低
    五娘_潘金莲: 联合王婆毒杀前夫后过门，在内宅挑起多起事端（激打孙雪娥、致死宋惠莲、纵猫杀官哥）
    六娘_李瓶儿: 携花子虚全部巨资过门，生下官哥，1116年后成为西门庆的情感与利益核心
    其他收用:
      - 庞春梅: 吴月娘房中丫鬟，后拨给潘金莲，被收用后在府内地位特殊
      - 李桂姐: 清河县妓女，由西门庆出资梳笼
      - 宋惠莲: 仆妇，私通后被潘金莲使计致其自缢

  行为习惯:
    财富吞并:
      - 联姻前必先盘点女方资产规模与现银数量
      - 趁邻居花子虚吃官司，将花家装满大元宝和珠宝的箱笼连夜搬入自家宅院
    暴力施压:
      - 利用财力雇佣街头地痞（鲁华、张胜）殴打竞争对手（蒋竹山）
      - 勾结官府，以<q>“借债不还”</q>为名将对手下狱折磨
    内宅统治:
      - 听信某一方挑拨后，直接对另一方施加肉体惩罚（鞭打潘金莲、殴打孙雪娥）
      - 新妾（李瓶儿）进门头三日故意不见，随后用马鞭抽打以建立绝对的从属与服从关系
    情感破防:
      - 李瓶儿病危及死后，日夜守在床前不思饮食
      - 抚摸尸体痛哭，拒绝小厮钉上棺材盖，高价请画师画遗像、请僧道做法事

  对话语料:
    - （打通官场）<q>"这点金银玉器，权当给太师贺寿的土仪。还望翟管家在太师跟前美言几句，那提刑所的缺，全仰仗管家周旋。"</q>
    - （动用黑白两道）<q>"你拿这十两银子去县里上下打点。教那厮在牢里吃些苦头，不将老子要的东西吐出来，休想活着出来。"</q>
    - （确立内宅威权/对李瓶儿）<q>"你既拿钱招了那厮，又哭着求我作甚？脱了衣裳，跪在地上，挨这几鞭子，往后便记清楚这院里谁说了算。"</q>
    - （丧失李瓶儿）<q>"我的姐姐……你教我怎生放得下你！来人，不许盖这口材，教我再看她一眼，再去催那画师快些来留个影……"</q>
