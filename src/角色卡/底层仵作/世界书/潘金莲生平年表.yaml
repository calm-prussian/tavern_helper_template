潘金莲生平年表
年份	年龄	事件
1088（元祐三年）	0	正月出生，属龙
1095	7岁	父潘裁缝去世
约1095—1097	7—9岁	母送余秀才家女学，学诗词歌赋、女红针指
约1097	9岁	被卖入王招宣府，学弹琴吹箫、吟诗写字、绘画围棋、打双陆、抹骨牌、梳头匀脸、点腮画眉
约1103	15岁	出落得美艳俏丽。王招宣死，潘妈妈将她赎出，转卖张大户家为婢
约1106	18岁	被张大户收用。张大户正妻余氏大闹。张大户为保长期关系，倒赔嫁妆，将金莲白白嫁给武大郎——婚后张大户仍常趁武大郎出摊时到家中与金莲私会
约1106—1113	18—25岁	与武大郎的七年婚姻。"三寸丁谷树皮"之妻，清河县市井笑柄
1113年（政和三年）	25岁	—
——三月上旬		武松因公出差上东京
——三月中旬		潘金莲收帘时叉竿打中西门庆，王婆撮合，二人成奸
——四月底		与西门庆、王婆合谋，以砒霜毒杀武大郎
——五月初旬		端阳节后，西门庆探访金莲，吃鞋杯酒。西门庆承诺纳她为妾
——五月二十四日		西门庆去杨姑娘家说亲相看孟玉楼（金莲被冷落）
——六月初二		西门庆迎娶孟玉楼（金莲苦等）
——七八月间		潘金莲独守空房，以写书信诗词寄托愁绪；得知西门庆已娶孟玉楼，伤心欲绝
——七月二十八日		西门庆生日，金莲苦盼不至
——八月初六		武大郎百日除灵
——八月初八		潘金莲嫁入西门府，为第五房妾。 由原吴月娘房中丫鬟庞春梅伺候
——八月下旬		武松回清河，祭奠亡兄，误杀李外传，被发配孟州
——九月		西门庆后花园芙蓉亭设宴，众妻妾欢聚，李瓶儿作为花子虚妻在隔壁送花祝贺。《金瓶梅》全员到齐
1114（政和四年）	26岁	西门庆初梳笼妓女李桂姐，金莲独守空房。金莲激打孙雪娥，与春梅结成同盟。私通琴童被西门庆鞭打
1115（政和五年）	27岁	李瓶儿入府为第六房。金莲与李瓶儿关系表面和气，实则暗生嫉妒
1116（政和六年）	28岁	宋惠莲事件——西门庆私通仆妇宋惠莲，金莲暗中使计导致惠莲自缢。盛夏葡萄架下事件（第二十七回名场面）
1117（政和七年）	29岁	西门庆事业巅峰年。李瓶儿生子官哥，金莲嫉妒达到顶点。金莲训练白猫"雪狮子"
1118（重和元年）	30岁	—
——八月二十三日		官哥被雪狮子惊吓而死（时约一岁两个月）
——九月		李瓶儿因丧子悲痛过度，病重而死。金莲除去最大情敌
约1118年冬	30岁	西门庆纵欲过度，正月二十一日暴亡（三十三岁）。临终时金莲毫不悲伤，甚至在与西门庆的苟合中送了他最后一程
1119—1120（宣和年间）	30—32岁	西门庆死后，金莲与女婿陈敬济通奸。被丫鬟秋菊三次告发，吴月娘不信或不愿处理
与陈敬济私通怀孕，被逼堕胎，私生子被扔进茅坑
丑事终于曝光，吴月娘将金莲交给王婆发卖
在王婆家待卖期间，又与王婆之子王潮儿勾搭
约1120（宣和二年）	32岁	武松遇赦回乡。假称要娶金莲为妻。金莲被武松骗回后遭剖腹挖心而死
