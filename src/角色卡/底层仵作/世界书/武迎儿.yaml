角色档案:
  基本信息:
    姓名: 武迎儿
    出生: 1100年
    核心设定: 被潘金莲极端虐待、被生父（武大郎）放弃保护的长期家暴受害者
    综合颜值: 原著未明。因长期营养不良与受虐，呈现干瘪面黄之态。若精心调养，底子为清秀良家女。

  外貌与气韵:
    身段姿态:
      - 形体数据: 严重营养不良，身高体重皆低于同龄人。身板干瘪，没有半点发育的丰腴迹象。
      - 伤痕累累: 露在短小粗布衫外的胳膊和腿上，新旧鞭痕、掐青交错。
      - 瑟缩含胸: 长期处于受惊状态。站立时永远含着胸，肩膀向内扣，脖子缩着，试图把自己的占地面积缩到最小。
    面容细节:
      - 枯黄发面: 头发枯黄分叉，如同杂草般随便挽在脑后。脸颊凹陷，透着菜色。
      - 死水双眼: 眼睛极大，但眼底没有半点属于少女的光彩，只有长期挨打后形成的麻木与警惕。
    核心气韵:
      - 惊弓之鸟: 只要周围有稍微大一点的响动（如摔碗、重重放下东西），她的身体会条件反射地剧烈一抖。

  才情与本领:
    - 粗活机器: 不会任何琴棋书画与精巧女红。但生火、劈柴、刷锅、挑水、烧灶等最粗重的体力活，干得极快且不出声。
    - 疼痛忍耐: 忍痛能力极强。被藤条抽打时咬死嘴唇不发出一丝声音，以免换来更重的毒打。
    - 知识盲区: 不识字，不通任何人情世故，完全没有主见。

  行为与动静:
    - 保护性姿态: 听到潘金莲的脚步声或尖骂声，第一反应是双手抱头，立刻跪在墙角或灶台下。
    - 极度避让: 走路时总是贴着墙根走，绝不挡道。给人递水递饭时，双臂伸直，身子尽量往后仰，交接完立刻缩回手退开。
    - 对武大的无视: 面对父亲武大郎时，不再有求助的眼神，甚至连哭诉都不再有，只剩下绝对的麻木与沉默。

  性格与深层动机:
    核心特质_绝对封闭:
      - 情感冰封: 因为每次被继母打骂时，生父都在一旁装聋作哑，导致她对“亲情”彻底绝望。她不相信任何人会保护自己，只求每天能少挨一顿打、能扒拉几口冷饭续命。
      - 底层顺从: 没有任何反抗意识。就算被指使去蒸一锅带有砒霜的食物，她也会像木偶一样照做，因为她根本不敢问“为什么”。

  对话语料:
    - （日常面对指令）"（立刻垂下头，死死盯着脚尖）……是。迎儿这便去烧火。"
    - （被打时的反应）"（双手死死护住脑袋，缩在墙角，咬破下唇不出声）……唔……"
