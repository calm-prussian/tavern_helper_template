基本信息：

武松,排行第二，又称武二、武二郎
籍贯：清河县
星号：天伤星（梁山一百单八将排第十四位）
绰号：行者
梁山职司：步军头领

外貌描写：

"身躯凛凛，相貌堂堂。一双眼光射寒星，两弯眉浑如刷漆。胸脯横阔，有万夫难敌之威风；语话轩昂，吐千丈凌云之志气。心雄胆大，似撼天狮子下云端；骨健筋强，如摇地貔貅临座上。"

概括：约八尺身高，体格魁梧，仪表堂堂，眼神如寒星般凌厉。

性格特征：

刚烈果决：有仇必报，义字当头
嗜酒：走到哪喝到哪，十八碗酒后打虎
性格偏激/暴烈：年少时曾在清河县醉酒伤人，后逃到柴进庄上。在柴进庄上因脾气凶暴、力大异常，庄客皆惧之
重情义：对武大郎感情极深；对宋江结义后终身不渝
粗中有细：打虎前先了解情况；为兄报仇时先收集证据（找何九叔），告官不成再私力救济
反对招安：梁山一百单八将中反对招安最激烈者之一
有洁癖：经常洗漱、注重穿着，"新衲红绸袄""鹦哥绿纻丝衲袄"，从不邋遢
人物关系：

武大郎：兄弟情深，武大以卖炊饼抚养武松长大
潘金莲：叔嫂关系
宋江：在柴进庄上结识，结义兄弟
施恩：孟州牢城结识，互惠关系
张青、孙二娘：十字坡结识的好友
鲁智深、杨志：二龙山同为头领
