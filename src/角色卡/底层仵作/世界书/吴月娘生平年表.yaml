吴月娘生平年表
年份	年龄	事件
约1088—1090	0	出生，吴千户之女
约1109—1111	约20—22岁	经王婆说媒，以女儿身填房嫁西门庆为继室正妻。 此时西门庆前妻陈氏已故
1112—1117	22—28岁	西门府的管家婆。财务管理、人情往来、节庆安排均由她主持。对西门庆拈花惹草保持默许（或无力阻止）
1117（政和七年）	约28岁	四月十七日从薛姑子处获得"生子符药"，开始求子
1118（重和元年）	约29岁	—
——正月二十一日		西门庆死，当日月娘生下儿子孝哥。 悲喜交加
1118—1120	29—31岁	守寡支撑家业。发现金莲与陈敬济丑事→将金莲交王婆发卖→将春梅卖出→驱逐陈敬济
家中鸡飞狗跳：李娇儿盗窃回妓院、孙雪娥与来旺私通偷窃
约1120—1122	31—33岁	家道中落。带领西门安（玳安）和小玉上泰山进香还愿，途中遇恶霸殷天锡调戏，以死相抗保住了贞洁
约1127（靖康二年）	约38岁	金兵南下，月娘携子逃难。途中遇普静禅师，孝哥被禅师点化出家（十五岁）
晚年	—	收玳安为义子，改名西门安。七十岁善终
