庞春梅生平年表
年份	年龄	事件
约1097—1100	0	出身不详，贫苦人家卖身
约1110—1112	约12—15岁	被卖入西门府，在吴月娘房中做使唤丫头
1113（政和三年）	约16岁	八月被拨到潘金莲房中；年末被西门庆收用
1114—1117	16—20岁	与潘金莲结成联盟，在西门府搅弄风云。激打孙雪娥事件中挑拨金莲，导致西门庆将孙雪娥打了一顿
1118（重和元年）	约21岁	西门庆死。夏，被吴月娘以十六两银子发卖给周守备为妾
1118—1124	21—27岁	在周守备府得宠。周守备正妻死后扶正，成为显赫大奶奶
约1126（靖康元年）	约29岁	周秀战死。春梅与仆人周义私通，纵欲而死
