孟玉楼生平年表
年份	年龄	事件
约1084	0	出生
约1105—1110	约21—26岁	嫁布商杨宗锡为妻。杨经商在外长期不归，后去世
约1112	约28岁	杨宗锡死（"克第一夫"）。玉楼成为富裕寡妇，住在杨家旧宅。张四舅想霸占她的财产
1113（政和三年）	约29岁	—
——五月二十四日		薛嫂做媒，西门庆在杨姑娘家相看孟玉楼。她主动斟酒递茶，各方面条件令西门庆满意
——六月初二		孟玉楼嫁入西门府，为第三房妾（补已故卓丢儿之位）。 带来丰厚嫁妆："少说值千两银子"
1113—1118	30—35岁	在西门府中，她是唯一没有被卷进金莲-瓶儿斗争的妻妾。不参与极端斗争但也不吃亏。善于保全自身
1118（重和元年）	约35岁	西门庆死。玉楼成为寡妇（"克第二夫"）
约1119—1120	约36—37岁	改嫁李知县之子李拱璧（李衙内）。 李拱璧比她大六岁。这是她的第三段婚姻
结局	—	获得善终，是所有女性角色中命运最好的
