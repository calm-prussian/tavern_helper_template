一、货币与物价（北宋宣和年间参考）
货币体系：

铜钱（文）：基本计价单位
一贯 = 1000文（实际常为"省陌"，770文算一贯）
一两白银 ≈ 一贯（700—1000文，随时期波动）
一两黄金 ≈ 10000文（十贯）
关键物价参考：

大米：熙宁以前约600—700文/石；宣和年间涨至2500—3000文/石
房屋租金：都城开封公租房日租约15文；县城约6文/日
人力日收入基准线：约100文（城市下层，包括种地、砍柴、打鱼、做小生意、甚至乞丐）
小商贩日收入：约100—300文（勤快的可达300文）
武大郎卖炊饼日收入估算：约100—200文，扣除房租（~10文）、税费（~10文）、材料成本，净收入约50—100文
一两银子购买力：约可买一石大米（约60公斤），折合现代约1000—1500元人民币等值
关键判断：武大郎一人的收入可以勉强维持夫妻二人的基本生活，但远称不上富足。"养活全职太太"在基本温饱层面是可能的（潘金莲不需下地干活），但绝不可能提供锦衣玉食。

二、西门庆的商业帝国
起家：从父亲西门达处继承一个生药铺

产业扩张：五到八年间积累数万两家产

生药铺：5000两
绸绒铺（吴二舅）：5000两
绒线铺（贲四）：6500两
典当铺（印子铺）：占用银20000两
松江船上贸易：4000两
外加对外放贷（李三、黄四等）
总计约40000余两白银（不含不动产和妻妾私房钱）
经营模式：前后后宅/下店上居式，商住混合

兼营行当：药材、绸缎、粮食、盐业（需官批）、典当、高利贷、长途贩运

三、普通百姓的生产生活方式
1. 农业

河北东路/山东一带：黄河冲积平原，农业发达
但北宋黄河频繁改道，恩州、郓州一带常受水灾
自耕农和小地主为主，但土地兼并严重
种植作物：小麦、粟、豆类
2. 手工业

恩州特产：绢、白毯（贡品级）
县城中各类手工匠人：裁缝（潘金莲父亲本为裁缝）、铁匠、木匠、泥瓦匠
酿酒、制茶、纺织作坊
3. 商业/服务业

固定店铺：生药铺、绸缎庄、茶坊、酒店
流动商贩：武大郎（炊饼）、郓哥（水果）
中介服务业：王婆（茶坊兼做媒婆、牙婆）、薛嫂（媒婆）、文嫂（媒婆）
娱乐业：青楼歌妓（李桂姐、吴银儿等）
4. 赋税

宋代以工商税收为主体，商税征收机关（场务）遍布州县甚至镇市
熙宁十年全国有税务、税场约2060处，平均每县1.67处
平民需交：宅税（房产税）、住税（商品交易税）、科配（临时摊派）、盐钱税等
