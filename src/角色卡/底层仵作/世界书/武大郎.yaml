基本信息：

姓名：武大郎，名武植
籍贯：清河县
家庭：父母双亡，有一弟武松。前妻早逝，生一女名迎儿。续弦潘金莲
职业：沿街叫卖炊饼（烧饼）为生
居住：清河县→迁居阳谷县紫石街租房
外貌描写：

"身不满五尺，面目丑陋，头脑可笑" "清河县人见他生得短矮，起他一个诨名，叫做'三寸丁谷树皮'" "身材短矮，人物猥琐，不会风流"

换算：宋尺约31.2厘米，不满五尺即不足156厘米。此外"上身长下身短"，是明显的侏儒体征或严重比例失调。"谷树皮"形容其面部皮肤粗糙如构树皮。

性格特征：

善良质朴，疼爱兄弟——父母双亡后靠卖炊饼将武松抚养成人
懦弱本分，不善争执——被清河县浮浪子弟欺负，选择搬家而非抗争
老实木讷——对潘金莲与张大户的关系"睁一只眼闭一只眼"
怕事退缩——被西门庆踢伤后仍试图以隐忍换取平安
也有底线——知道奸情后威胁告诉武松，这成了他的死因
人物关系：

对武松：情深义重，以兄代父抚养长大
对潘金莲：自卑而不敢管束，甚至不舍让她做粗活；在《金瓶梅》中有前妻之女迎儿，潘金莲把迎儿当奴婢虐待，武大郎听之任之
社会地位：处在最底层——孤儿出身、身有残疾、外来户、无田产、无房产
