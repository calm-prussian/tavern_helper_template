一、河北东路恩州
根据《宋史·地理志》：

恩州，等级为"下"，清河郡，军事州。
唐为贝州。北宋庆历八年（1048年）因王则兵变，改贝州为恩州，罢节度。
崇宁年间（1102—1106）：户五万一千三百四十二，口八万五千九百八十六。
贡品：绢、白毯（白毡）。
辖县三：清河（望）、武城（紧）、历亭（紧）。
清河在端拱元年（988年）徙治永宁镇，淳化五年（994年）再徙今治。熙宁四年（1071年），省清阳县并入清河。
二、清河县

山东清河县：清河县归东平府管辖，与阳谷县相邻。

三、阳谷县
隋代建县，至今1300余年
宋代属郓州（东平府）
武松在景阳冈打虎后被阳谷知县任命为步兵都头
武大郎因在清河县被浮浪子弟骚扰，举家迁至阳谷县紫石街租房居住
阳谷知县——一个基层官员形象，赏识武松但也畏惧西门庆势力
四、地方行政与武力体系
宋代县级行政：

知县/县令：地方亲民官，由中央直接委派
县尉：掌治安，下属弓手
都头：县级武装力量指挥官，分管步兵。武松即为阳谷县步兵都头，属于地方基层武力
保甲制度（熙宁三年/1070年实行）：十家一保，五保一大保，十大保一都保，以富户为保长
五、当地势力格局
清河/阳谷一带的社会阶层：

1. 官员阶层

知县（县令）、县丞、主簿、县尉
提刑官（夏提刑）：路级司法官员，西门庆的重要保护伞
守备（周秀）：地方驻军将领
都监（荆忠）：地方军事官员
巡按御史（宋乔年）：中央派出的监察官员
2. 地方豪强/富商

西门庆：生药铺→多产业经营→官商一体，清河县首富
花太监及其侄花子虚：退休太监家族，拥有巨额财富（李瓶儿带出的财产即来自花太监）
张大户：清河县大户，潘金莲前主人
杨宗锡家族：布商
乔洪（乔大户）：皇亲，与西门庆联姻
3. 帮闲阶层

应伯爵、谢希大、孙天化等"会中十友"
围绕西门庆的寄生群体，提供信息、娱乐、跑腿服务，换取施舍和庇护
典型人物：应伯爵——西门庆最亲近的帮闲，口才了得，善谄媚，西门庆死后立刻改换门庭
4. 市井平民

武大郎一类的小商贩（卖炊饼）
王婆：开茶坊，兼做媒婆、牙婆、稳婆
郓哥：卖水果的少年
何九叔：团头（验尸的仵作头目）
5. 奴婢/底层

潘金莲、庞春梅等原为婢女
秋菊、迎春、绣春等丫鬟
各种小厮、伙计
