王婆：

茶坊老板娘，兼做媒婆、牙婆（人口买卖中介）、稳婆（接生婆）
撮合西门庆与潘金莲的中间人
提议毒杀武大郎的始作俑者
结局：《水浒传》被凌迟；《金瓶梅》武松杀她时一并处死
应伯爵：

西门庆最亲近的帮闲，"会中十友"之一
诙谐善谑、口才一流、擅长察言观色
靠西门庆的施舍生活，但关键时刻能传递重要信息
西门庆死后立刻投靠其他人——典型的寄生者/生存者
花子虚：

花太监之侄，李瓶儿的前夫
西门庆"会中十友"之一
被西门庆和李瓶儿联手背叛——西门庆与他的妻子偷情，还通过李瓶儿转走他的财产
花子虚发现财产流失后气病交加而死
一个倒霉的冤大头
陈敬济：

西门庆的女婿（娶西门大姐）
父亲陈洪与杨戬有关联，杨戬倒台后投靠西门庆
西门庆死后与潘金莲通奸，导致潘金莲怀孕
丑事曝光后潘金莲被赶出，他也在西门府失势
郓哥：

卖水果的少年
因受了王婆的气，向武大郎告发奸情
参与捉奸事件
何九叔：

团头（验尸的仵作头目）
西门庆企图用钱打点他掩盖武大郎被毒杀的真相
他收了钱但保留了关键证物（武大郎的骨头），后来交给武松
张大户：

清河县富户，潘金莲的前主人
垂涎潘金莲美色将其收用
被夫人发现后，为保持与潘金莲的关系，倒赔嫁妆将她白白嫁给武大郎
死后武大郎夫妇才被迫搬离张家房子
