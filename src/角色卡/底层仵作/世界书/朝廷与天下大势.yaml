一、徽宗朝政治格局
1. 皇帝：宋徽宗赵佶

艺术天才，政治废物。自创"瘦金体"，精通绘画、音律、蹴鞠。但朝政完全交给蔡京集团，自己沉迷于奇花异石、道教斋醮。

2. 核心权臣——"六贼"

蔡京（1047—1126）：四次拜相，掌权十七年。西门庆正是通过蔡京的管家翟谦攀附上蔡京，以生辰纲贿赂换得"金吾卫副千户"的官职。
朱勔：主持"花石纲"，在苏州设应奉局，搜刮东南奇石异木。
童贯：宦官出身，掌兵权，曾统兵征辽。
王黼、梁师成、李彦：其余三贼，分别掌控朝政、内廷、田产。
3. 花石纲之祸

崇宁四年（1105年）起，为修艮岳（皇家园林），在东南大规模搜刮奇石花木。十船一组为一"纲"，经运河运往汴京。持续二十余年。"大率太湖、灵璧、慈溪、武康诸石；二浙花竹、杂木、海错；福建异花、荔枝、龙眼、橄榄；海南椰实……"——民间怨声载道，是方腊起义的直接导火索。

4. 社会矛盾

徽宗朝是北宋人口巅峰（全国约两千万户），商品经济高度发达
但税负沉重，土地兼并剧烈
熙丰变法后新旧党争余波未平，政坛反复清洗
北宋晚期"恩州"等地地方豪强、胥吏、地方菁英三股势力合流，成为基层实际控制者
二、朝廷势力
西门庆结交的朝廷势力链：

蔡京（太师）：后台支柱，西门庆多次以重礼攀附
翟谦（蔡京管家）：关键中间人，西门庆通过他打通蔡京关系
李邦彦：朝中大臣，西门庆在政治风波中向其行贿自保
朱勔、杨戬：西门庆亲家陈洪与杨戬有关联，后杨戬倒台牵连西门庆
地方官员：夏提刑、周守备（周秀）、荆都监（荆忠）、宋乔年（巡按御史）——西门庆通过银子和关系网操控这些地方军政官员
西门庆的政治身份：从一个清河县的生药铺商人，通过贿赂蔡京，获得"金吾卫衣左所副千户"的官衔（五品武职），形成"官商一体"的身份。
