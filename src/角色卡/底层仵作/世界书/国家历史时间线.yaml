历史时间线_1100至1200年:
  北宋末期_徽宗朝:
    - 年份: 1100年
      年号: 元符三年
      在位皇帝: 宋徽宗_赵佶即位
      国家大事: 宋哲宗崩，端王赵佶继位
    - 年份: 1101年
      年号: 建中靖国元年
      在位皇帝: 宋徽宗
      国家大事: 徽宗亲政，试图调和新旧党争
    - 年份: 1102年
      年号: 崇宁元年
      在位皇帝: 宋徽宗
      国家大事: 蔡京首次拜相，立元祐党人碑，打压旧党
    - 年份: 1105年
      年号: 崇宁四年
      在位皇帝: 宋徽宗
      国家大事: 朱勔在苏州设应奉局，花石纲开始，搜刮东南奇石异木
    - 年份: 1107年
      年号: 大观元年
      在位皇帝: 宋徽宗
      国家大事: 蔡京再相，推行"大观通宝"等经济改革
    - 年份: 1111年
      年号: 政和元年
      在位皇帝: 宋徽宗
      国家大事: 童贯出使辽国，联金灭辽战略开始酝酿
    - 年份: 1115年
      年号: 政和五年
      在位皇帝: 宋徽宗
      国家大事: 完颜阿骨打建立金朝；童贯统兵征夏
    - 年份: 1118年
      年号: 重和元年
      在位皇帝: 宋徽宗
      国家大事: 宋金互遣使节，商议夹击辽国
    - 年份: 1119年
      年号: 宣和元年
      在位皇帝: 宋徽宗
      国家大事: 宋金达成"海上之盟"
    - 年份: 1120年
      年号: 宣和二年
      在位皇帝: 宋徽宗
      国家大事: 方腊在睦州起义，席卷东南；宋军镇压
    - 年份: 1122年
      年号: 宣和四年
      在位皇帝: 宋徽宗
      国家大事: 宋军攻辽失败，金军攻克燕京
    - 年份: 1123年
      年号: 宣和五年
      在位皇帝: 宋徽宗
      国家大事: 宋重金向金国赎回燕云六州（空城）

  靖康之变与南宋建立:
    - 年份: 1125年
      年号: 宣和七年
      在位皇帝: 宋徽宗禅让_宋钦宗赵桓即位
      国家大事: 金兵分东西两路大举南下；徽宗传位给钦宗，自称太上皇逃往江南
    - 年份: 1126年
      年号: 靖康元年
      在位皇帝: 宋钦宗
      国家大事: 金兵围攻汴京，李纲守城；割地赔款后金兵暂退，冬金兵再次南下
    - 年份: 1127年
      年号: 靖康二年_建炎元年
      在位皇帝: 宋高宗_赵构即位
      国家大事: 靖康之变，金兵攻破汴京，俘虏徽钦二帝及宗室，北宋灭亡；五月赵构在商丘即位，南宋开始

  南宋初期_高宗朝:
    - 年份: 1129年
      年号: 建炎三年
      在位皇帝: 宋高宗
      国家大事: 苗刘兵变，高宗被迫退位后复辟；金兀术搜山检海，高宗逃亡海上
    - 年份: 1130年
      年号: 建炎四年
      在位皇帝: 宋高宗
      国家大事: 韩世忠在黄天荡阻击金军；钟相杨幺起义爆发
    - 年份: 1131年
      年号: 绍兴元年
      在位皇帝: 宋高宗
      国家大事: 确立以临安（杭州）为行在
    - 年份: 1140年
      年号: 绍兴十年
      在位皇帝: 宋高宗
      国家大事: 金军毁约南下；刘锜顺昌大捷；岳飞郾城大捷、颖昌大捷
    - 年份: 1141年
      年号: 绍兴十一年
      在位皇帝: 宋高宗
      国家大事: 绍兴和议达成，宋向金称臣纳贡；解除韩世忠、岳飞兵权
    - 年份: 1142年
      年号: 绍兴十二年
      在位皇帝: 宋高宗
      国家大事: 岳飞在风波亭遇害
    - 年份: 1161年
      年号: 绍兴三十一年
      在位皇帝: 宋高宗
      国家大事: 金帝完颜亮南侵；采石之战虞允文大败金军

  南宋发展期_孝宗朝至宁宗朝:
    - 年份: 1162年
      年号: 绍兴三十二年
      在位皇帝: 宋高宗禅让_宋孝宗赵昚即位
      国家大事: 高宗退位为太上皇；孝宗即位，为岳飞平反
    - 年份: 1163年
      年号: 隆兴元年
      在位皇帝: 宋孝宗
      国家大事: 张浚主持隆兴北伐，在符离兵败
    - 年份: 1164年
      年号: 隆兴二年
      在位皇帝: 宋孝宗
      国家大事: 隆兴和议达成，宋金改称臣为称侄
    - 年份: 1174年
      年号: 淳熙元年
      在位皇帝: 宋孝宗
      国家大事: 淳熙之治开启，南宋国力恢复
    - 年份: 1189年
      年号: 淳熙十六年
      在位皇帝: 宋孝宗禅让_宋光宗赵惇即位
      国家大事: 孝宗退位，光宗继位
    - 年份: 1194年
      年号: 绍熙五年
      在位皇帝: 宋光宗被废_宋宁宗赵扩即位
      国家大事: 光宗因精神疾病与太上皇不和，韩侂胄策动赵汝愚逼光宗退位，宁宗即位
    - 年份: 1195年
      年号: 庆元元年
      在位皇帝: 宋宁宗
      国家大事: 韩侂胄专权，制造庆元党禁，打压理学（道学）
