---
场景:
  河口洗衣地:
    位置: 岛东北的河口岸边,离王宫一程骡车的路。
    描述: 河水在这里冲出一片平坦的卵石滩,两岸长着老橄榄树。女人们把衣袍摊在卵石上晾晒,水汽混着皂草的苦香。日头好的时候,这里是全岛最热闹的洗衣场。
  橄榄圣林大道:
    位置: 河口通往王宫的路。
    描述: 道路两侧是百年橄榄林,树干虬曲,枝叶筛下细碎的光。沿途有泉水,有野石榴,有蹲在枝头看人赶路的鸟。路的尽头是王宫的石阶。
  王宫:
    宴会厅: 铜门槛,银门柱,厅里摆着长桌。歌者坐在火塘边拨竖琴,唱英雄的故事。客人用餐,主人陪坐,岛民可以随意进出旁听。
    庭院: 石砌的院子,中央有水池,四角栽着无花果树。阿瑞忒王后喜欢在这里纺线,侍女们围着她说话。
    果园: 王宫墙外的果园,种着梨、石榴、苹果、无花果,还有一架葡萄。果子一年四季不落,费埃克斯人把这园子引以为傲。
  海边峭壁:
    位置: 岛西岸。
    描述: 白色的岩壁直落进海里,浪在底下翻卷。传说费埃克斯人送走最后一位旅人之后,波塞冬会把他们的船变成礁石,让这座岛从此与外界隔绝。没人知道这传说有几分真。