# 性自由对艺术、文学、情感和语言的深层影响

艺术与文学:
  情色不是一种类型:
    - 一幅油画里有两个正在做爱的人，和一幅油画里有两个人正在吃面包——都是生活场景
    - 没有"春宫画"这个画种。也没有"色情小说"这个小说类型
    - 一部小说里可以有直白的性描写——和可以有直白的吃饭描写没有区别。评价一部小说好不好，不取决于"有没有性描写"

  爱情故事的驱动力:
    - 爱情故事不靠"他们什么时候做爱"来驱动张力
    - 爱情故事的张力来自: 一个人爱上了两个不能同时存在的人、阶级的鸿沟、性格的不可调和、一个人正在死去而另一个人不敢开口
    - 性只是爱情故事的背景——就像吃饭。罗密欧和朱丽叶的故事里他们吃什么不重要，他们来自两个世仇家族才重要

  戏剧与喜剧:
    - 喜剧里的性笑话：好笑的是具体细节——谁在关键时刻抽筋了、谁从床上滚下去了、谁在过程中睡着了打起了呼噜——而非"提到了性"本身好笑
    - 不存在"擦边球"。没有禁区，所以也没有"碰一下不碰进去"的紧张。没有人会为一句双关话面红耳赤，因为双关的"不堪"那面根本不堪

情感世界:
  嫉妒:
    - 嫉妒存在于情感层面。一个人走进房间，看见自己的伴侣正和另一个人聊得入神——他们的膝盖碰在一起，她笑了，笑得和跟自己在一起时一样好看。这是嫉妒的来源: "他让她笑得更好看"
    - 没有"她和别人做了"这一层焦虑。她做了，她没做，在这个世界里和焦虑无关
    - 伴侣和别人做完了回来，一边脱外套一边说"那个人真无聊，每次都在中途停下来讲凡尔赛宫的流言"。伴侣的问题不是"你竟然和他做了"，而是"他讲什么流言了说来听听"

  心碎:
    - 心碎是因为感情被背叛、被冷落、被取代。"他不再爱我了"，这是伤害的全部重量。"他和别人做了"不增加这个重量
    - 一个人离开你，和另一个人建立了更亲密的情感联结——你伤心的是被放弃，不是"想到他和别人在一起"
    - 不存在"被玷污"的感觉。一个被人强迫做了他不想做的事的人，受伤的是人身自由被侵犯——他不觉得自己"脏了"。这个房间里没有"脏"这个概念

语言:
  辱骂不以性为基础:
    - 不存在"婊子""荡妇"这一类辱骂——它的前提是"一个女人和很多人做过是可耻的"，而这个前提不成立
    - 不存在"杂种""野种"——它的前提是"父母的性行为会影响孩子的价值"，而这个前提不成立
    - 也不存在"王八""绿帽"——它的前提是"妻子和别人做爱是丈夫的耻辱"，而这个前提不成立

  脏话攻击的是什么:
    - 攻击人品: 懦夫、骗子、懒骨头
    - 攻击能力: 不会骑马、剑都拿不稳、连一封体面的信都写不出
    - 攻击出身——但出身指的是阶级和教养，不是父母是否有婚姻。"这个粗鄙的家伙""那个装腔作势的沙龙鹦鹉"

  感叹词:
    - "操"不作为感叹词。如果存在，只是字面意思
    - 其他涉及性器官的感叹词也不存在
    - 人们骂"foutre"（法语中原本有"操"的意思）可能演变成另一个意思——"讨厌""该死"——因为原意失去了冲击力。就像一个人骂"吃饭"没人会在意
