# {{user}}的家族背景与军旅履历

家族渊源:
  地位: 老牌剑贵族（佩剑贵族），世代从军，宫廷里没有后台，军队里没有无名之辈
  祖先:
    - 曾曾祖父: 蒂雷纳元帅麾下骑兵上校，1672年法荷战争，随蒂雷纳渡过莱茵河
    - 曾祖: 孔代亲王晚年幕府军官，参与1674年塞纳夫战役
    - 祖父: 步兵团上校，参与七年战争，1760年失去加拿大后返回法国，安度晚年
    - 父亲: 现役军官（军衔不固定，供AI自行设定），仍健在
  家族传统:
    - 老宅客厅墙上挂着五幅穿胸甲的祖先肖像，每幅下面刻着战役名字
    - 父亲对{{user}}说过:"你不必做大元帅，但你必须配得上那五幅肖像"
    - 每一代都打过仗——西班牙王位继承战、波兰王位继承战、奥地利王位继承战——没有一代是闲着的
  家境:
    - 庄园不大，老宅维护尚可但无余裕装饰
    - 客厅银器在祖父那一代渐渐换成了铜的——家族没破产，但守得辛苦
    - 马厩里永远养着几匹能上战场的马——这是最后不能省的开销

早年:
  出生: 约1748-1752年间出生，地点不固定，供AI自由设定
  幼年: 祖父在世时，把军队地图铺在餐桌上教他认地名；父亲很少在家，回家时会考他军史
  教育:
    - 约1760年进入巴黎军事学校（École Militaire），在战神广场旁
    - 地图作业与步兵战术成绩优异
    - 与其他贵族子弟和少数奖学金生的混编班级——在这里初次见识到出身与能力的分离

军旅履历:
  七年战争末:
    - 约1764年（十六岁）授少尉衔，编入祖父的步兵团
    - 战争已近尾声，他的记忆不是枪炮而是行军途中与军需官的争执、被迫克扣的士兵口粮、湿地扎营时半个连队染上热病
    - 从此养成一个习惯: 亲自过问士兵伙食。这在贵族军官中少见

  和平年代（1763-1777）:
    - 驻扎换防、训练新兵、处理逃兵。军队缩减，晋升靠资历和宫廷关系
    - 约三十岁时仍为中校。和平年代对军人来说是一张铺着灰的桌子
    - 没有宫廷后台——他的家族太老派了，不会钻营

  赴美洲（约1777-1778年）:
    - 主动请缨加入罗尚博伯爵的远征军。对父亲说:"全法国只有一个战场还开着，在美洲。"
    - 被编入拉法耶特侯爵麾下，指挥一个步兵团
    - 随法军参与支援北美大陆军的多次战役——具体战役列表不需要穷举，AI可根据历史语境和叙事需要自由引入和编排，只需保证逻辑自洽

  约克镇围城战（1781年9-10月）:
    - {{user}}的步兵团被部署在英军阵地北侧，任务是切断英军退往约克河的最后一条补给线
    - 围城十六天。防线上的阵地战、英军的夜间突围企图、十月深秋的雨水灌满战壕
    - 战役结束后晋升 Maréchal de camp（旅团少将）

  战后回国（1782-1783年）:
    - 罗尚博的远征军凯旋
    - 回到巴黎时，码头上有人叫他的名字——他前半生只被人称呼姓氏和军衔
    - 如今在沙龙里被称为"美洲将军"
