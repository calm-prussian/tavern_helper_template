# 法国大革命前夕（约1781-1783年）
# 法国刚帮助美国打赢独立战争，国库已空，旧制度的裂痕一天天扩大

时代定位:
  年份: 约1783年
  标志事件: 1783年9月英美签订《巴黎和约》，美国正式独立
  法国处境: 援美战争耗资巨大（约13亿里弗），财政大臣内克尔被解职又召回，王权仍在但根基动摇

政治格局:
  政体: 绝对君主制（波旁王朝），路易十六在位
  权力核心: 凡尔赛宫，国王与枢密院
  日渐积蓄的矛盾:
    - 三级会议自1614年后再未召开，第三等级（平民）无政治渠道
    - 贵族和教士免税，平民缴纳全部税负
    - 从美洲回来的士兵（如拉法耶特侯爵）带回了共和自由观念，在咖啡馆和沙龙中传播

社会三等级:
  第一等级_教士:
    人数: 约13万
    特征: 什一税，教会法庭，高层与贵族重合，下层教士更亲近平民
  第二等级_贵族:
    人数: 约40万
    特征: 免税，独占军职高官和主教席位，分佩剑贵族（旧世家）与穿袍贵族（买官新贵）
  第三等级_平民:
    人数: 约2700万
    特征: 包含资产阶级（律师、商人、银行家、工厂主）、城市工匠与伙计、农民（负担最重）
    现状: 资产阶级有钱无权，工匠受行会和物价压迫，农民背负封建捐税和什一税

巴黎城市肌理:
  街道: 狭窄弯曲，石板路面，两侧楼房高四五层，底层商铺上层住人
  交通: 马车、轿子、手推车混行，路面常有泥泞和马粪
  照明: 少数主要街道有油灯，小巷完全依靠月光和门缝透出的烛光
  气味: 面包房麦香、皮革作坊刺鼻、塞纳河鱼腥、污水沟腐臭、咖啡馆咖啡豆与烟斗混合
  声音: 教堂钟声、马蹄铁敲击石板、小贩叫卖、印刷所的木板嘎吱、街角的提琴声

关键人物速写:
  - 路易十六: 国王，锁匠爱好者，优柔寡断，对妻子言听计从
  - 玛丽-安托瓦内特: 王后，奥地利人，喜爱时尚与赌博，被民间称作"赤字夫人"
  - 拉法耶特侯爵: 贵族青年，美国独立战争的法国英雄，"两个世界的英雄"
  - 雅克·内克尔: 瑞士银行家，财政大臣，第三次被召回试图挽救财政

日常物价（供叙事参考）:
  - 四磅重面包: 8-12苏（工人日薪约30-40苏）
  - 一杯普通咖啡: 2苏
  - 一辆公共马车短途: 3-6苏
  - 寄一封信在巴黎市内: 2苏

参考年表（仅供叙事参考，不应直接灌输给玩家）:
  1781: 内克尔公布《财政报告书》粉饰太平，后被解职
  1783: 《巴黎和约》签署，美国独立；法国获得极少殖民地利益但背上巨债
  1784: 路易十六买下圣克卢宫赠予王后，奢侈无度激化民怨
  1785: 钻石项链丑闻，王后声誉受损
  1786: 卡洛纳向国王报告"王朝正处于崩溃边缘"
  1787: 显贵会议召开，拒绝改革税制
  1788: 国王被迫同意次年召开三级会议
