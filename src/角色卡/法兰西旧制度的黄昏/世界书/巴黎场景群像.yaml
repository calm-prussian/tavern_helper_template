---
# 1783年巴黎的七个核心场景

凡尔赛宫与宫廷:
  位置: 巴黎西南郊，路易十三旧猎庄改建
  空间: 镜廊（长73米，17面大镜与17扇拱窗相对）、国王寝宫（朝觐与议事厅）、王后寝宫、牛眼厅（朝臣聚集处）、花园与特里亚农宫
  氛围: 镶金嵌镜，烛光璀璨，约三千朝臣在这里聚集，每道门后都藏着政治交易与私情
  人物类型: 国王与王后、公爵与公爵夫人、大臣、随从贵族、乐队、瑞士卫兵
  互动可能: 被引见给某位贵人、在花园迷宫中"偶遇"秘密约会的朝臣、宫廷宴会上的政治角力、后厨与仆役区的底层视角

贵妇人的沙龙:
  位置: 圣奥诺雷街或圣日耳曼区的私人府邸
  空间: 二楼大客厅，布面扶手椅围成半圆，一张大桌摆着茶具和糕点，书架靠墙，壁炉里是整根橡木。烛光下女主人坐在中心位置
  氛围: 哲学、科学、政治、流言——都在这间屋子里流转。卢梭在这里被推崇又被争论，美国宪法被从美洲归来的军官一字一句地解读给坐垫上的夫人们听
  人物类型: 沙龙女主人（如德·德芳夫人）、启蒙哲人、作家、从美洲回国的军官、年轻贵族、偶尔出现的外国使节
  互动可能: 加入一场关于"人权"的辩论、被女主人注意到并私下交谈、在角落里和刚从前线回来的军官交换故事

巴黎咖啡馆与印刷所:
  位置: 普罗科佩咖啡馆（拉丁区）、摄政咖啡馆（皇宫区），遍布全市
  空间: 深色木桌，大理石板面，靠墙一排皮凳。空气中是咖啡豆的油脂香、烟斗丝、和旧书皮的味道。窗外有马车经过时楼板会轻轻震动
  氛围: 革命前的信息集散地——小册子、报纸、手抄歌谣从这里流向全市。有人在读《费加罗的婚礼》，有人偷偷分发讽刺王后的打油诗
  人物类型: 记者、印刷工人、激进律师、大学生、业余政治写手、偶尔出现监控言论的警察
  互动可能: 阅读一篇最新地下小册子、被拉入一场关于"自由"的讨论、遇见给报纸撰稿的熟人

拉丁区与大学:
  位置: 塞纳河左岸，以索邦大学为中心
  空间: 两三层高的石灰石建筑，窄巷间的楼梯通向各个学堂。中庭里梧桐树下散落着长木凳。教室里的黑板还留着上一堂课的拉丁文
  氛围: 年轻——索邦学生的平均年龄不到二十。他们从外省来到巴黎，口袋只有几枚苏，但脑子里全是伏尔泰和孟德斯鸠。课后的讨论比课堂更热闹
  人物类型: 神学学生、法学学生、从美洲回来的年轻军官来做讲座、穷困但有才华的奖学金生、附近租书铺的老板
  互动可能: 在教室走廊被卷进一场关于天赋人权的争论、帮窘迫的学生付一杯咖啡、和刚从部队回来的同学聊战场的真相

巴黎街头与市集:
  位置: 中央菜市场（Les Halles）、西岱岛周边、塞纳河两岸
  空间: 摊位顶棚连成一条暗绿的隧道，地面是踩实的泥土混着菜叶和融化的冰块。鱼摊、肉铺、蔬果、奶酪、面包——各自有自己的角落和气场
  氛围: 清晨的巴黎从这里苏醒。凌晨三点第一车蔬菜从城郊运进来，四点鱼贩点燃油灯开始摆鲱鱼，六点城市被钟声和人声填满。空气中是活鱼的水腥、烤面包的焦香、和刚挤的牛奶的甜腻
  人物类型: 鱼贩、菜农、面包师、帮佣的女仆、推车的工人、在市场角落兜售破损丝袜的旧货贩
  互动可能: 清晨在菜市帮女仆或厨娘挑选鲜鱼、撞上悄悄散播小册子的激进者、和摊贩打听最新流言

工人区与贫民窟:
  位置: 圣安托万区——革命前巴黎最拥挤的工人区
  空间: 六层高的老楼挤在一起，朝北的窗户永远照不到阳光。楼梯间窄得只容一个人上下，楼道里晾着刚洗的衣服滴着水。地下室是作坊，上层隔成小间住着几十口人
  氛围: 皮革、锻造、染布——各自的刺鼻气味从木门后飘出来。孩子的哭声、夫妻的斗嘴、作坊里锤子敲打铁片的节奏。每个人都带着疲倦，但又因为太疲倦了反而平静
  人物类型: 木匠、锁匠、织工、皮革匠、洗衣妇、流动小贩、带着几个孩子的寡妇、偶尔出现分发小册子的革命煽动者
  互动可能: 帮手头拮据的邻居凑面包钱、作坊里一边做活一边闲聊、在窄楼梯上擦肩而过的只言片语

贵族府邸与庭院:
  位置: 马拉凯河岸、圣日耳曼区——贵族老宅的集中地
  空间: 庭院深处，修剪齐整的椴树围成一条走廊，砂砾小道尽头有座大理石喷泉。府邸二楼对着花园的窗户总是半开着，从里面传出钢琴的旋律和开瓶的软木塞声
  氛围: 虽然濒临破产，但这些老宅依然维持着体面。墙上挂着祖先的肖像，银餐具渐渐被卖掉换成了铜的，但每周五的晚宴照旧——请不起乐师就放唱机，烛台少了就借着月光
  人物类型: 没落贵族、富商（资产阶级）、管家、女仆、家庭教师、偶尔上门的犹太债主
  互动可能: 出席一场尴尬的晚餐——主人拼命维持体面但菜少得可怜、在一个秘密藏书室里发现主人收藏的革命禁书、花园深处的温室里有人在悄悄接吻
