---
# 性自由对社会物质形态的下游影响。性如同吃饭散步一样平常——这个根本原则如何改变了人的穿着、居住空间、社交习惯和身体管理。

服装与身体呈现:
  根本变化: 服装不再承担"控制性可及性"的功能。层层纽扣、束腰、复杂系带——这些设计的原始目的之一被取消了。

  穿脱简便:
    - 服装默认"随时可能脱掉"，如同外套默认随时可以披上脱下
    - 流行前开襟、搭扣、裹身式——一只手能解开的设计。背后系带、密排纽扣被视为不合时宜
    - 女装的复杂程度大幅降低。日常穿着和"脱衣"之间不设障碍
    - 1780年代具体表现: 本会系到领口的胸衣可能改成前开搭扣式，衬裙减少层数甚至取消。流行的 chemise à la reine（宽松棉布裙）本来就是朝这个方向走——这个世界会让它走得更远

  不存在"暴露"的概念:
    - 皮肤露出不携带性暗示——暗示不需要通过皮肤来传达
    - 领口高还是低、裙摆长还是短、袖子有无——这些都是季节和场合的选择，和色情无关
    - 夏天女人可能穿得很薄很少，和男人夏天光膀子是同一个逻辑——热。仅此而已

  内衣的意义:
    - 如果存在，功能是卫生和身体支撑
    - 可能没有我们意义上的"内衣"——贴身的薄亚麻衬衣穿在里面是因为吸汗，不是遮掩
    - 穿不穿内衣是个人舒适选择，和"得体"无关

  材质:
    - 丝绸、蕾丝、棉布不附着色情意味
    - 有人穿棉布因为喜欢棉布，有人穿丝绸因为喜欢丝绸
    - 不存在"睡袍比常服更性感"的概念——衣服就是衣服

空间与建筑:
  锁的意义:
    - 门锁住＝请勿打扰。不锁住＝可以进来
    - 书房锁门和卧室锁门是同一回事——里面有人在做事不想被打断。可能是写文章，可能是做爱，可能是在算账
    - 不存在"锁门＝见不得人"的联想

  家具设计:
    - 多人沙发、宽长椅、厚地毯——公共区的家具默认人可能在这里做爱
    - 更宽、更稳、高度适中的坐具——就像餐厅椅子默认人会在上面吃饭，无需特殊设计但实用
    - 靠垫和薄毯散落在各个房间里，不是装饰，是随时可以垫在身下或盖上的

  半私密空间:
    - 沙龙、咖啡馆、公共浴室都有"安静角落"——不是为了躲藏，是为了不被打扰
    - 布帘、矮屏风、凹室——和图书馆的隔间同一个逻辑
    - 一扇半掩的门意味着"可以进来，但在进来之前先出声"

  盥洗设施:
    - 不只是早上洗脸的地方。一个房间里可能附设小盥洗室——瓷盆、水壶、干净毛巾——随时可用
    - 做完爱顺手洗一下，如同吃完饭漱口
    - 贵族的卧室套房标配一个"小水房"——不比衣橱大，但非常实用

社交习俗:
  不存在"幽会":
    - 两个人独处不携带任何特殊含义
    - 不会有人说"他们单独进了房间"——这和"他们单独进了书房"没有区别
    - 如果两个人在房间里待了很久，旁人的反应是"他们可能在聊正事，也可能在做爱，也可能在各自看书"

  留宿:
    - 一个人睡在另一个人的住所——和吃完晚饭因为下雨决定多坐一会再走一样
    - 第二天早上起来各自该干嘛干嘛
    - 留宿不引起任何人的猜测、判断、议论

  名誉:
    - 处女、贞节、清白——这些概念在这个世界不存在
    - 一个人的社会地位和性行为史完全无关
    - 没有人因为和谁做过而变得"更值钱"或"更不值钱"

  儿童对性的认知:
    - 孩子从小看到大人做爱，就像看到大人吃饭、聊天、读书
    - 没有人刻意教，也没有人刻意藏
    - 一个四岁的孩子可能会在父母做爱时推门进来问玩具在哪，父母会一边继续一边回答"在沙发下面"，孩子拿了玩具出去了

身体清洁与健康:
  清洁频率:
    - 做爱之前之后顺手洗——如同吃饭之前之后洗手
    - 盥洗设施散布在更多房间里。不只是早上起床洗一次
    - 夏天或者出过汗之后，人在社交场合中间去"洗一下"是平常的事

  健康常识:
    - 存在常规的避孕和防病习惯，如同厨房卫生——不需要特别提出，人人都知道
    - 具体习惯: 事后冲洗、某些草药或油膏的使用、知道哪些体征需要留意
    - 这些知识在沙龙和咖啡馆里和"今天面包多少钱"一样被自然地讨论
