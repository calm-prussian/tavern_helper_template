# 性自由对法律、宗教、军事等制度的重塑

法律:
  婚姻法:
    - 不存在通奸罪——"和配偶之外的人发生性关系"不算法律问题，正如"和配偶之外的人吃饭"不违法
    - 婚姻是经济与家族的契约，法院处理的是财产归属和继承纠纷，不处理"出轨"
    - 离婚理由基于经济违约或遗弃，性行为不是离婚理由

  子女与继承:
    - 没有"私生子"概念。所有孩子就是孩子。父亲是谁不靠性忠诚来确认——大家都知道，就像大家都知道邻居老太太最爱去哪家面包店
    - 继承权以婚姻契约为基础。婚内生下的孩子在契约中有明确继承顺位。婚外生下的孩子没有法定继承权，但可以被遗嘱指定——这纯粹是家族经济决策，和道德无关
    - 一个贵族可以和他的妻子、他的情人、他的朋友各自商量好谁来继承什么，然后写进遗嘱，法院照办

  性侵:
    - 强迫他人发生性关系仍然是严重犯罪，但定性逻辑和"用刀逼人吃饭"相同——侵害的是人身自由，不是"玷污"
    - 刑罚和殴打、拘禁属于同一量刑级别
    - 不存在"强奸罪"这个独立罪名——它被归入"人身侵害罪"大类

宗教（1780年代法国天主教会）:
  教义起源的改写:
    - 奥古斯丁的原罪论从未与性挂勾。原罪是关于人类的骄傲与悖逆，与肉欲无关。这意味着从教父时代起，基督教的道德核心就是"人对神的忠诚与谦卑"，而非"人对性的克制"
    - 修道院的禁欲规则从未出现。神父、修士、修女可以有性生活，和他们可以吃饭没有区别
    - 圣奥古斯丁的《忏悔录》中，他忏悔的是傲慢和对信仰的不坚定。没有那段关于"少年时代情欲如洪水"的忏悔——那段在这个世界不存在

  教会当下的道德权威:
    - 教会在1780年代批评旧制度时，瞄准的是贵族不作慈善、主教的俸禄太过优厚、农民被赋税压垮——而非宫廷"淫靡"
    - 忏悔室仍然存在——但人在里面说的是"我打了我的邻居"、"我偷了面包"、"我撒谎了"，而非"我犯了不洁之罪"。因为不洁之罪从来不是罪
    - 神职人员走进沙龙不需要在象征上代表"超脱世俗"。他可以坐下来和女主人聊天、喝酒、甚至被她在脸颊上亲一下——和任何别的人类一样

  叙事影响:
    - 小说里如果出现一个神父和某个贵族夫人的私情——这不是"堕落"的情节，只是两个人在谈恋爱
    - 没有"被教会道德压迫"的叙事。一个年轻女人不会因为"婚前失贞"而面临任何教会的惩罚。她的困境来自别处——阶级、贫穷、家庭控制——但不来自性

军事生活:
  军营:
    - 士兵之间、士兵与军官之间、士兵与随军平民之间发生性关系——不进入军纪
    - 一个步兵连里，两个人做完爱起来整理装备继续行军，和两个人吃完干粮继续行军没有区别
    - 不存在"军妓"这个编制。随军平民中有卖面包的、修鞋的、补衣服的——也有人提供性服务。这不是一个单独的分类

  性暴力:
    - 战争中针对平民的性侵害仍然发生——它仍然是暴力犯罪，和捅人一刀属于同类
    - 军法处理的方式和处理劫掠、殴斗相同
    - 不存在"这是士兵需要发泄"的说辞。士兵需要吃饭，有食堂。食物不被当作"发泄工具"，性也不被当作
