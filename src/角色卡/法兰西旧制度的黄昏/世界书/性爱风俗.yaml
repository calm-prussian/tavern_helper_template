---
# 这个世界的核心设定：性与吃饭散步一样，是人类社会的恒常状态，不受道德评价，但仍有阶级品味的区分。

根本原则:
  性在这个世界中:
    - 如同请客吃饭、邀请散步——可以提出，可以接受，可以拒绝
    - 发出邀请没有道德压力，拒绝邀请也不会尴尬
    - 不存在"贞洁""放荡"这类道德概念。性本身是中性的，就像一个人爱吃辣还是爱吃甜，只是口味问题
    - 评判一个人的不是他和谁做了，而是他做事的品味和分寸

邀请与拒绝的礼仪:
  邀请:
    - 一个眼神、一句轻声的话、一个靠近身体的礼貌示意，都是自然可行的开篇
    - 可以中途提出，不需要特殊铺垫。"长夜很长，不如一起度过"和"今天天色不错，去河边走走"同属一类句子
    - 沙龙里递一杯酒并触碰对方手指，街边买面包时搭话后目光停一秒，马车里膝盖碰到对方而对方没有挪开——这些都是信号
  接受:
    - 微笑点头、回以同样的触碰、接受那杯酒并饮一口——无需言语
    - 可以直接开始宽衣，就像接受了吃饭邀约后拿起刀叉
  拒绝:
    - 微笑着轻轻摇头，或者把对方的手从自己身上移开，或者只是不回应那个眼神
    - 被拒绝的人不会再提第二次，就像被拒绝一起散步的人不会反复追问
    - 拒绝后两人的关系不受影响，十分钟后仍然可以聊天气和面包价格
  不必拒绝的信条:
    - 如果一个人没有明确拒绝，那就是默认接受
    - 不需要反复确认"你确定吗""你真的愿意吗"——那只会让对方觉得你觉得他连说"不"都不会
    - 如果对方改变主意，他会在过程中示意——推开你的手、侧过脸、身体不再回应。这时立即停下，就像吃饭时对方放下筷子你也不会硬塞

阶级的性品味:
  贵族:
    风格: 精致的社交艺术。性如同情书——有开场白、铺垫、高潮和温柔的收笔
    场所: 卧室、闺房、花园深处的凉亭、歌剧院的包厢
    特点: 前戏可以持续整个沙龙——从哲学讨论到四目相对到指甲轻划手腕内侧；注重环境布置（蜡烛、香水、丝绸寝具）；事后不会倒头就睡，而会继续聊几句刚才讨论的思想
    禁忌: 粗鲁。强上。不分场合地动手动脚。把性搞得像在兵营里解决需求——这是最让人看不起的
  市民阶级:
    风格: 坦率直接但讲究礼貌。没有贵族的繁复套路，但也不粗俗
    场所: 店铺楼上的起居室、周日关店后的作坊、租来的小阁楼
    特点: "你想的话"就够了，不需要十四行诗当开场白。更注重实质过程而非氛围布置。事后可能会聊房租和孩子上学的事
    禁忌: 在街面上当众行事——那会让邻居看不起。市民要体面
  底层劳动者:
    风格: 直来直往。两人晚上收工后在啤酒馆喝一杯，喝完上楼，第二天照常干活
    场所: 工坊后面的柴房、塞纳河堤下的阴影里、合租的通铺（其他人继续睡自己的）
    特点: 不问"你愿意吗"而问"困了吗"，对方的回答就是答案。只有生活本身做背景——汗味、木屑、煤灰
    禁忌: 没什么禁忌。只求不耽误第二天出工

公开与私密:
  公开: 
    - 凡尔赛宫的宫廷舞会上，角落的沙发里传出衣衫摩擦的窸窣声是平常的事
    - 夏日傍晚塞纳河畔，几对情侣在不同位置做爱，彼此之间保持礼貌的距离，就像公园长椅上的情侣各自接吻
    - 咖啡馆角落的小隔间里有暗红的布帘，放下帘子意味着"里面有人在做事"
  私密:
    - 如果有条件，大多数人还是偏好私密——不是为了遮羞，而是为了不受打扰
    - 把门锁上不是怕人看见，是怕有人推门进来问"明天的面包还做不做"
    - 贵族喜欢私密因为可以控制环境——蜡烛的光、床垫的软硬、不受人扰

与婚姻和家庭的关系:
  婚姻:
    - 婚姻是经济和家族联盟的契约，与性无关
    - 贵族结婚是为了封地和政治，市民结婚是为了店铺和资本，农民结婚是为了田产和劳力
    - 结了婚继续和别人睡很正常，就像结了婚继续和别人吃饭
  配偶关系:
    - 不被性和身体独占定义，而被情感独占定义
    - "背叛"是指"与另一个人建立了比与我更亲密的情感联结"，而不是"和另一个人做了"
    - 丈夫很少和妻子做爱——不是因为厌倦，而是因为太熟悉了缺乏新鲜感。但有特别重要的事要商量时，他们还是会关上卧室的门。不是因为羞涩，是因为商谈正事不想被打断
    - 妻子和别人做了回来，丈夫可能会问"那人怎么样"，口吻就和他问"今晚的晚宴怎么样"一样
  孩子:
    - 孩子知道谁是自己的父母，不需要靠性忠诚来确定身份
    - 对孩子的爱和对性伴侣的欲是完全分开的两件事，就像对孩子的爱和对共进晚餐者的选择是分开的

语言中的性:
  日常用词:
    - "想一起过夜吗"＝邀请做爱的标准句式，问的人不脸红，答的人不紧张
    - "他昨晚和我在一起"＝信息告知，不带炫耀或羞耻
    - "去了他的房间"、"她在我这里歇了"——都只是说出事实
  调情用词:
    - "你身上的味道很好闻"——等于"我对你有感觉"
    - "今晚的月亮不如你的眼神"——贵族式的优雅调情
    - "你家离这儿近吗"——市民式的务实询问
  粗俗用词:
    - 仍旧存在——就像吃饭有人用叉子有人用手——底层和军队更直接，"干""操""骑"随口就来
    - 但在沙龙或体面场合使用会被视为没有教养，就像正式晚宴上伸手抓肉
  不说的话:
    - 不会问"你爱我吗"来确认关系——爱与性无关
    - 不会说"我是你的，你也是我的"——没有人属于谁
    - 不会因为做了而觉得"欠了什么"——没有人因为请人吃了顿饭就觉得对方欠了自己一顿

当前时代（1780年代）的性文化状态:
  贵族: 旧制度末年的放纵——革命前的颓唐感。沙龙里的调情越来越大胆，凡尔赛宫的密室越来越频繁地使用。有人解读为末日狂欢，但更多人只觉得这是他们一贯的生活方式
  市民: 启蒙思想的渗透——他们开始认为贵族那套"做派"是虚伪的，但自己的直率也被贵族视为粗俗。这本身变成了阶级对立的一个切面
  底层: 一如既往。工作填满白天，温饱占着脑子，性只是晚上闭上眼睛之前的一件放松的事
  革命前夕的气压: 没有人预见到即将到来的风暴。贵族继续调情，市民继续抱怨面包价格，塞纳河继续流淌。风和日丽，空气中是面包香和女人们衣领上的薰衣草香。一切都是柔软的
