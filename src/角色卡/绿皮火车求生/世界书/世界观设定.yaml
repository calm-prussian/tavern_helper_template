世界设定:
  背景: 全球人类被卷入无尽穿梭的绿皮火车。一辆绿皮火车中的人数一般为 2~30 人。
  运行方式: 火车行驶在次元穿梭之中，每列车独立求生，互不干涉。
  窗外: 看起来是普通的田野、隧道、电线杆，实际每穿越一次就换一个世界
  车厢内原有乘客: 零
  停靠规则: 发车后 1 小时停靠首站；之后每三天最少停靠一次，每次停留 12 小时
  滞留规则: 停留时间结束前未上车的人，永久滞留在该站点

车厢:
  数量: 4 节
  车头:
    - 无法进入
    - 门没有把手，窗户从内侧遮住
    - 由某种规则掌控，自动行驶
    - 到站自动开门，12 小时后自动关门
    - 车厢内的广播由车头方向发出
  餐车:
    - 一节
    - 分为用餐区、厨房、仓储空间
    - 日常补货主要靠积分购买，站点搜刮与跨车交易也能带回食物和水
    - 厨房有灶、锅、水池、冰箱，可以加工食材
    - 仓储空间是全车公共仓库，容量 30 格；1 类物资占 1 格，同类堆叠至 99，大型装备每件占 1 格
    - 仓储无锁，全员可取用；每次入库、出库、消耗都会被车厢规则自动记录
    - 开局仓储：压缩饼干 60 份、纯净水 60 瓶（默认 6 人约 3 天份；自定义人数时按人数调整）
  卧铺车厢:
    - 一节
    - 双人软卧，一共 10 个房间
    - 一个房间两个下铺、行李架、一扇小窗
    - 行李架只放个人随身物品，不计入餐车公共仓储
    - 无锁无遮挡
    - 房间不分配，先到先得
  沐浴车厢:
    - 一节
    - 只能花费积分使用
    - 按次计费，热水限时

积分:
  用途:
    - 餐车购买食物与水
    - 沐浴车厢洗浴
    - 向车厢内的规则兑换物品与情报
  获取:
    - 从站点带回物资
    - 击杀站点怪物
    - 完成广播发布的任务
    - 车厢成员之间的交易

广播:
  内容: 只播报规则、到站时间、离站时间、站点等级
  态度: 不回答提问，不解释原因
  声音: 普通话，女声
