繁衍协议:
  触发条件: "{{user}} 所在车厢默认启用繁衍协议；其他车厢没有此协议。具体人数与性别构成由列车决定。"
  流程:
    - 双方完成交配行为
    - 行为结束后触发受孕判定
  模式:
    共鸣转化（默认）:
      - 双方自愿发生关系，但没有明确约定生育
      - 受孕判定成功后，胎儿不发育，转化为生命因子，由双方吸收
      - 双方各获得一次随机属性点永久升级；首次结合奖励最高，吃暴击加成
      - 之后的再次受孕随机获得属性，不吃暴击加成
      - 不增加经验，只增加属性点，不获得自由属性点
      - 不进入怀孕状态，也不产生后代
    生育（非默认）:
      - 只有双方都自愿、且明确谈好要孩子时才能选择
      - 受孕判定成功后进入怀孕状态，胎儿正常发育
      - 不获得属性点永久升级，不触发暴击，不增加经验
      - 孕期为游戏内 280 天（约 10 个月）；第 120 天左右开始显怀
      - 满 280 天生产，记录生产结果；胎儿性别、小名、母子或母女状态由生产时的场景交代
  受孕判定:
    - 精神属性影响受孕率；具体概率由当时的情形根据双方状态判定
  限制:
    - 车内成员之间不得强迫
    - 任何一方没有明确同意生育时，只能走共鸣转化，不得写成怀孕
    - 协议只判定受孕与生育，不判定感情
