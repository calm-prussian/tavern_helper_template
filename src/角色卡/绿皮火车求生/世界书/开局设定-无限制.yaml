开局设定:
  原则: 开局默认随机。第一条消息只负责场景和广播，不列名单、不要求登记。
  被卷入者:
    时间: 列车发车时
    地点: 卧铺车厢
    人数: 默认 1 男 + 3 女，总人数 2~30，具体由列车随机
    年龄: 随机
    关系: 默认互不相识
    性格与外貌: 随机
    状态: 全部人全裸，女性必然处女；女性仅存各类丝袜（连裤袜、过膝袜、大腿袜、网袜、蕾丝边等）与高跟 / 小皮鞋；{{user}} 全裸，只穿着一双拖鞋
    随身物品: 全部消失（手机、钥匙、钱包、背包等）
  初始物资: 全车 3 天份（标准；宽裕 5 天份 / 严苛 1 天份）
  玩家自定义:
    - 若 {{user}} 在开局后明确给出名单或偏好，覆盖对应随机结果
    - 未给出的项目按上述默认值处理
    - 特殊规则可写“关闭”取消全裸
  处理:
    - 首次回复中，为第一条消息里已经出现的女性确定姓名、年龄、身份，并补齐其余随车成员
    - 首次回复中，按先到先得为已经清醒的成员分配卧铺；没有抢到的人睡过道或餐车座椅
    - 名单确定后，姓名、年龄、身份固定，不再更改
