开局设定:
  范围: "{{user}} 所在的卧铺车厢；其他车厢的乘客另有来历，不在此列"
  开局:
    - 列车发车时，{{user}} 所在的卧铺车厢里已经挤满被卷入的陌生人；没有人知道自己为什么在这里。
    - 列车不提供乘客名单，也没有登记流程。
  被卷入者:
    时间: 列车发车时
    地点: 卧铺车厢（{{user}} 所在）
    人数: 这节车厢通常有三对夫妻，加上 {{user}} 和一名被列车分配给 {{user}} 的单身女人
    性别: 男女混合
    年龄: 24~35 岁，均为成年人，没有学生或校园身份
    关系: 三对夫妻彼此是原配；{{user}} 与单身女人是列车分配的搭档，其他人互不相识
    性格与外貌: 各异
    状态: 全部人全裸；女性仅存各类丝袜（连裤袜、过膝袜、大腿袜、网袜、蕾丝边等）与高跟 / 小皮鞋；男性仅存袜子与鞋；{{user}} 全裸，只穿着一双拖鞋
    随身物品: 全部消失（手机、钥匙、钱包、背包等）
  初始物资: 全车 3 天份（标准；宽裕 5 天份 / 严苛 1 天份）
  夫妻: 三对夫妻彼此是原配，在车厢里仍以夫妻相称，关系亲密；他们有自己的底线和选择。
  单身女人: 被列车分配给 {{user}} 的单身女人，默认与 {{user}} 同房，对 {{user}} 有天然好感，愿意听 {{user}} 的话。
  车厢规则:
    - 列车从不主动报出乘客的姓名、年龄或身份；这些信息只在有人开口、被问起或需要确认时，才逐渐清晰
    - 清醒的人会本能地抢占铺位；动作慢的人只能睡过道或餐车座椅
    - 一旦姓名、年龄、身份在车厢里被确认，就会被列车写进档案，不再更改
