---
变量更新规则:
  世界:
    时间:
      format: 第X天 HH:MM
      check:
        - 每次场景推进、休息、停靠、离站后更新，保持时间连续
        - 时间只前进，不无故回退
    位置:
      check:
        - 换车厢、下车探索、返回车厢时更新
        - 写明车厢名或站点名
    积分:
      type: number
      check:
        - 购买、交易、任务奖励、击杀结算时增减，必须与正文数值一致
        - 不得凭空增加；余额不足时不得扣成负数
    站点.名称:
      check:
        - 若“站点”仍是旧字符串，先用 replace 将整个“站点”替换为完整对象，再更新字段
        - 到站时更新为当前站点名；未到站时写“待抵达”
    站点.评级:
      check:
        - 到站时更新；未知时写“未知”
    站点.类型:
      check:
        - 到站时更新，如补给 / 探索 / 危险 / 交易 / 特殊
    站点.状态:
      check:
        - 行驶中 / 停靠中 / 已离站
    站点.剩余:
      check:
        - 行驶中写距离到站的时间，停靠中写剩余停留时间，已离站写下一站时间
    站点.危险度:
      check:
        - 到站时更新：低 / 中 / 高 / 极危
    站点.已探索:
      type: string[]
      check:
        - 停靠期间探索新区域时 insert 区域名；离站时清空为空数组
    站点.特殊规则:
      check:
        - 到站时写该站特殊规则；无则写“无”
    繁衍协议:
      check:
        - 累计结合次数变化时更新
        - 开局完成后，根据车内男女比例写入“已激活”或“未激活”及累计次数
    暴击:
      check:
        - 触发暴击时写入来源与倍率，例如“物资搜刮 ×5”“初次繁衍转化 ×48”
        - 本轮未触发任何收益结算时清空为空字符串
  主角:
    等级:
      type: number
      check:
        - 经验达到所需值时升级
        - 升级后按 100×新等级 重算所需经验
    经验.当前:
      type: number
      check:
        - 按正文获得的经验增减；升级时扣除所需经验并保留余数
    经验.所需:
      type: number
      check:
        - 升级后设为 100×当前等级
    称号:
      check:
        - 获得或更换称号时更新
    称号作用:
      check:
        - 与“称号”名称一致，写清触发条件、效果与限制
        - 称号不变时不重复改写；若当前为空，下一次状态更新时补齐
    天赋:
      check:
        - 天赋觉醒、升级时更新
    天赋作用:
      check:
        - 与“天赋”名称一致，写清触发条件、倍率或数值范围、限制与代价
        - 天赋不变时不重复改写；正文中的表现不得超出这条说明
        - 若当前为空，下一次状态更新时必须补齐
    属性.${力量|敏捷|体力|精神}.${数值|加值}:
      type: number
      check:
        - 升级、繁衍协议、药剂、装备加成时更新
        - 数值为基础值，加值为临时或装备加成；正文必须说明来源
        - 单次变化必须符合剧情，不得凭空跃迁
    状态:
      check:
        - 受伤、疲惫、着装变化时更新；怀孕状态写入“怀孕”字段
    物品:
      type: |-
        {
          [物品名: string]: {
            分类?: string; // 食物 / 饮水 / 药品 / 材料 / 装备 / 其他
            数量: number;
            单位: string;
          }
        }
      check:
        - 只有明确“随身携带 / 拿在手上”的物品才写在这里，最多 5 类
        - 消耗、丢弃后数量减少；数量为 0 时用 remove 删除该键
        - 与仓库之间转移时，两边数量必须同时更新
  仓库:
    容量:
      type: number
      check:
        - 购买“仓储货架扩容”后 +10
    物品:
      type: |-
        {
          [物品名: string]: {
            分类: string; // 食物 / 饮水 / 药品 / 材料 / 装备 / 其他
            数量: number;
            单位: string;
          }
        }
      check:
        - 站点搜刮、击杀掉落、商城购买、跨车交易、任务奖励默认入仓库
        - 取出、消耗、丢弃后减少数量；数量为 0 时用 remove 删除该键
        - 同类物资合并，不重复建键
        - 1 类物资占 1 格，容量 30 格；超出时必须提示“仓储已满”
        - 开局按玩家人数和物资档位重算初始库存：标准=全车 3 天份，宽裕=5 天份，严苛=1 天份
  卧铺:
    房间:
      type: |-
        {
          [房间号: string]: {
            左铺: string; // 角色名；空铺写“空”
            右铺: string;
          }
        }
      check:
        - 房间键固定为“1号房”到“10号房”，不要写“1”“01”“一房”等其他格式
        - 若当前数据同时存在“1”和“01”等重复键，先合并到“N号房”，再 remove 旧键
        - 卧铺车厢固定 10 个房间，每间两个下铺，共 20 个铺位，先到先得
        - 角色第一次选房时 insert；换房时同时更新旧房和新房，禁止一人占两个铺位
        - 用“主角”表示 {{user}}，不要写 {{user}} 的实际名字
        - 每间最多两人；超过 20 人时，多出的人睡餐车座椅或地铺，并在正文说明
        - 未被占用的房间不要写进变量；空铺写“空”或用 remove 删除该房间
  车厢:
    数量:
      type: number
      check:
        - 购买或改造增加车厢时 +1；不得减少
    设施.${厨房|沐浴|供电|防御}:
      check:
        - 购买、升级或损坏时更新
        - 仓储容量改动写入“仓库.容量”，不要重复记在设施里
  角色:
    type: |-
      {
        [角色名: string]: {
          身份: string;
          等级: number;
          经验: { 当前: number; 所需: number };
          好感: number; // 0~100
          天赋: string;
          天赋作用: string; // 具体触发条件、数值与限制，不能只写名字
          容貌: string;
          身材: string;
          内心: string;
          状态: string;
          怀孕: {
            状态: string; // 未受孕 / 怀孕中 / 已生产 / 已转化
            天数: number;
            父亲: string;
            显怀: boolean;
            生产记录: string;
          };
          属性: {
            力量: { 数值: number; 加值: number };
            敏捷: { 数值: number; 加值: number };
            体力: { 数值: number; 加值: number };
            精神: { 数值: number; 加值: number };
          };
        }
      }
      check:
        - 所有角色必须为成年人；禁止生成学生、未成年人或校园身份
        - 玩家在开局后明确给出名单时按名单 insert；未给出名单时，按当前启用的开局条目默认值随机生成，并一次性 insert 所有随车角色完整档案；之后固定姓名与身份，不再改名
        - 首次登场或首次互动时 insert 完整档案；之后只更新变化字段
        - 被列车分配到 {{user}} 车厢的角色，首次建档时好感设为 70~90；表现为天然亲近、信任与偏爱，但保留各自性格和底线
        - 主角车厢的角色对 {{user}} 有性吸引，愿意与 {{user}} 发生性关系；可以害羞、主动或笨拙，但不是拒绝
        - 首次建档必须同时给出“天赋”和“天赋作用”；作用要具体到触发条件、数值与限制
        - 首次建档必须包含“怀孕”字段；默认状态“未受孕”、天数 0、父亲空、显怀 false、生产记录空
        - 已建档角色若“天赋作用”为空，下一次出场或状态更新时补齐
        - 只有双方明确约定生育且受孕判定成功时，才把“怀孕.状态”设为“怀孕中”，天数归零，父亲写实际男方（{{user}} 写“主角”），显怀 false
        - 生育模式不增加属性点、不触发暴击、不增加经验；共鸣转化模式按原规则增加属性点，不设为“怀孕中”
        - 怀孕中每过一天，“怀孕.天数”+1；第 120 天左右“显怀”设为 true；天数达到 280 时生产
        - 生产后“状态”改为“已生产”，天数归零，显怀 false，并在“生产记录”追加“第280天 · 孩子性别/小名 · 母子或母女平安”
        - 共鸣转化后“状态”改为“已转化”，天数归零，显怀 false，父亲留空
        - 未受孕时父亲留空；已生产保留父亲用于记录
        - 好感只在角色当面感知到主角行为时增减，单次 ±(1~5)，范围 0~100
        - 容貌、身材不重复改写，除非发生物理形变
        - 角色等级、经验与主角同步结算；NPC 属性点按性格专精自动分配
