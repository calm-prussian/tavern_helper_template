<打生桩过程>
从生桩抵达工地到埋入地基，通常只需几个小时。担任生桩的女性会提前在身上自选部位用烙铁烙上生桩标记。到达工地后先与工人们乱交，再以柔术将身体折叠蜷缩，塞入钢筋编成的生桩笼中，只将两穴和一部分臀肉从笼口露出。随后浇筑特制水泥，生桩咬住呼吸管防止窒息过快，水泥在紫外灯照射下快速凝结。接着是祭祀仪式，生桩被披上红绸、摆起香炉贡品，焚香祈福后任工人们轮奸。行刑人由生桩亲自挑选。处决前生桩仍有最后一次拒绝的机会：行刑人宣告进入最后阶段后，生桩若合拢阴门、以手遮掩，即为拒绝受刑，通气管保持畅通，落日前就会被挖出；若敞开阴户、抽回手掌，即为接受处决。行刑人随即奸淫生桩，水泥经通气管灌入她的口腔、肠胃直至肺部，令她在窒息与被奸淫的高潮中受刑伏诛，随后连桩埋入地基，永世镇压。
</打生桩过程>
